                      class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
                    >
                      {isAnalyzing ? 'Scanning Draft...' : 'Run AI Writing Coach'}
                    </button>

                    <button
                      type="button"
                      onClick={() => setSubmissionStatus('submitted')}
                      class={`px-4 py-2 font-semibold text-xs rounded-xl shadow transition-all ${
                        submissionStatus === 'submitted'
                          ? 'bg-amber-600 text-white'
                          : 'bg-purple-600 hover:bg-purple-500 text-white'
                      }`}
                    >
                      {submissionStatus === 'submitted' ? 'Submitted to Teacher' : 'Submit to Teacher'}
                    </button>
                  </div>

                  <button
                    type="button"
                    onClick={() => window.print()}
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow transition-all flex items-center gap-2"
                  >
                    <span>Printable PDF</span>
                    <span>&darr;</span>
                  </button>
                </div>
              </div>

              {/* Teacher Reviewed Feedback Display */}
              {teacherFeedback.comments && (
                <div class={`p-5 rounded-2xl border space-y-2 no-print ${isDarkMode ? 'bg-purple-950/40 border-purple-800' : 'bg-purple-50 border-purple-200'}`}>
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-purple-500 uppercase tracking-wider">Teacher Review & Feedback</span>
                    <span class="text-xs font-mono font-bold text-purple-400">Grade: {teacherFeedback.grade || 'A'}</span>
                  </div>
                  <p class={`text-xs leading-relaxed ${isDarkMode ? 'text-purple-200' : 'text-purple-900'}`}>"{teacherFeedback.comments}"</p>
                </div>
              )}

              {aiFeedback.length > 0 && (
                <div class={`p-5 rounded-2xl border space-y-3 no-print ${isDarkMode ? 'bg-indigo-950/50 border-indigo-800' : 'bg-indigo-50 border-indigo-200'}`}>
                  <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>AI Writing Coach Feedback</h4>
                  <div class="space-y-2">
                    {aiFeedback.map((fb, idx) => (
                      <div key={idx} class={`p-3 rounded-xl border text-xs space-y-1 ${isDarkMode ? 'bg-slate-900/90 border-indigo-900/80 text-indigo-200' : 'bg-white border-indigo-200 text-indigo-900'}`}>
                        <span class="px-2 py-0.5 rounded text-[9px] font-bold uppercase bg-indigo-600 text-white">
                          {fb.type}
                        </span>
                        <p>{fb.suggestion}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Student Self-Evaluation Rubric */}
              <div class={`p-5 rounded-2xl border space-y-4 print-card ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h4 class={`font-bold text-xs uppercase tracking-wider print-text ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                  Detailed Student Self-Evaluation Rubric
                </h4>

                <div class="space-y-4 text-xs">
                  {Object.entries(criteriaDescriptors).map(([key, item]) => {
                    const currentScore = rubricScores[key];
                    return (
                      <div key={key} class={`p-4 rounded-xl border space-y-2 print-card ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                        <div class="flex justify-between items-center">
                          <span class={`font-semibold print-text ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}>{item.title}</span>
                          <span class="text-indigo-500 font-mono font-bold">{currentScore}/4</span>
                        </div>

                        <p class={`text-[11px] p-2 rounded border leading-relaxed print-text ${
                          isDarkMode ? 'bg-indigo-950/50 border-indigo-900/60 text-indigo-200' : 'bg-indigo-50 border-indigo-200 text-indigo-900'
                        }`}>
                          {item.levels[currentScore]}
                        </p>

                        <div class="flex gap-2 pt-1 no-print">
                          {[1, 2, 3, 4].map(score => (
                            <button
                              key={score}
                              onClick={() => setRubricScores({ ...rubricScores, [key]: score })}
                              class={`flex-1 py-1 rounded text-[11px] font-bold border transition-all ${
                                currentScore === score
                                  ? 'bg-indigo-600 text-white border-indigo-500'
                                  : isDarkMode ? 'bg-slate-900 text-slate-400 border-slate-800' : 'bg-white text-slate-600 border-slate-300'
                              }`}
                            >
                              Level {score}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div class={`p-3 rounded-xl border flex items-center justify-between text-xs print-card ${
                  isDarkMode ? 'bg-emerald-950/60 border-emerald-800/80 text-emerald-300' : 'bg-emerald-50 border-emerald-200 text-emerald-800'
                }`}>
                  <span class="print-text">Self-Evaluation Total Score:</span>
                  <span class="font-bold text-sm font-mono print-text">
                    {Object.values(rubricScores).reduce((a, b) => a + b, 0)} / 16 Points
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. PEER DISCUSSION PADLET BOARD SECTION
    // ==========================================
    function PeerPadletSection({ synthesisTitle, synthesisText, isDarkMode }) {
      const [padletPosts, setPadletPosts] = useState([
        {
          id: 'post-1',
          author: 'Anonymous Researcher #402',
          title: 'Synthesis of Local Digital Infrastructure & Blended Learning',
          content: 'This review synthesizes studies examining regional internet access gaps across Philippine provinces. The evidence demonstrates that scaffolded offline modules significantly mitigate student task anxiety during online synthesis.',
          selfRating: 'Proficient',
          rubricFeedback: {
            evidence: 'Exemplary',
            integration: 'Proficient',
            critiqueQuality: 'Proficient'
          },
          likes: 5,
          comments: [
            { id: 'c-1', author: 'Anonymous Peer', text: 'Great alignment between local context and foreign literature! Consider adding specific methodology details regarding sample sizes.' }
          ]
        },
        {
          id: 'post-2',
          author: 'Anonymous Researcher #819',
          title: 'Gamification Mechanics in Literature Reviews',
          content: 'Exploring how badge mechanics increase task completion rates by 42% in sophomore research methods coursework.',
          selfRating: 'Developing',
          rubricFeedback: {
            evidence: 'Needs Improvement',
            integration: 'Proficient',
            critiqueQuality: 'Developing'
          },
          likes: 2,
          comments: [
            { id: 'c-2', author: 'Anonymous Peer', text: 'The thesis is interesting, but you need in-text parenthetical citations to support claims on gamification efficacy.' }
          ]
        }
      ]);

      const [newPostTitle, setNewPostTitle] = useState(synthesisTitle || '');
      const [newPostContent, setNewPostContent] = useState(synthesisText || '');
      const [newPostSelfRating, setNewPostSelfRating] = useState('Proficient');
      const [commentInputs, setCommentInputs] = useState({});

      const peerRubricDescriptors = {
        evidence: {
          label: '1. Evidence Grounding & In-Text Citation',
          levels: {
            'Exemplary': 'Exemplary: Every claim is supported with flawless parenthetical in-text citations.',
            'Proficient': 'Proficient: Claims are cited with accurate author attributions and minor formatting gaps.',
            'Developing': 'Developing: Contains broad generalizations with inconsistent or incomplete citations.',
            'Needs Improvement': 'Needs Improvement: Entirely missing in-text parenthetical citations or empirical evidence.'
          }
        },
        integration: {
          label: '2. Thematic Synthesis & Literature Comparison',
          levels: {
            'Exemplary': 'Exemplary: Seamlessly contrasts local Philippine studies against international literature.',
            'Proficient': 'Proficient: Clear thematic grouping with clear comparative analysis across papers.',
            'Developing': 'Developing: Summarizes papers individually under themes with minimal cross-comparison.',
            'Needs Improvement': 'Needs Improvement: Disorganized list of paper abstracts with zero thematic structure.'
          }
        },
        critiqueQuality: {
          label: '3. Constructive Academic Critique',
          levels: {
            'Exemplary': 'Exemplary: Identifies methodology gaps and suggests actionable research improvements.',
            'Proficient': 'Proficient: Offers respectful, clear, and relevant academic suggestions.',
            'Developing': 'Developing: Vague feedback with limited actionable guidance.',
            'Needs Improvement': 'Needs Improvement: Unconstructive or missing academic review recommendations.'
          }
        }
      };

      const handlePublishPost = (e) => {
        e.preventDefault();
        if (!newPostContent.trim()) return;

        const anonId = Math.floor(100 + Math.random() * 900);
        const newPost = {
          id: 'post-' + Date.now(),
          author: `Anonymous Researcher #${anonId}`,
          title: newPostTitle || 'Research Literature Review Synthesis',
          content: newPostContent.trim(),
          selfRating: newPostSelfRating,
          rubricFeedback: {
            evidence: newPostSelfRating,
            integration: newPostSelfRating,
            critiqueQuality: newPostSelfRating
          },
          likes: 0,
          comments: []
        };

        setPadletPosts([newPost, ...padletPosts]);
        setNewPostTitle('');
        setNewPostContent('');
      };

      const handleAddComment = (postId) => {
        const text = commentInputs[postId];
        if (!text || !text.trim()) return;

        setPadletPosts(padletPosts.map(post => {
          if (post.id === postId) {
            return {
              ...post,
              comments: [...post.comments, { id: 'c-' + Date.now(), author: 'Anonymous Peer', text: text.trim() }]
            };
          }
          return post;
        }));

        setCommentInputs({ ...commentInputs, [postId]: '' });
      };

      const handleLikePost = (postId) => {
        setPadletPosts(padletPosts.map(post => {
          if (post.id === postId) {
            return { ...post, likes: post.likes + 1 };
          }
          return post;
        }));
      };

      const handleUpdatePeerRubric = (postId, criteriaKey, newLevel) => {
        setPadletPosts(padletPosts.map(post => {
          if (post.id === postId) {
            return {
              ...post,
              rubricFeedback: {
                ...post.rubricFeedback,
                [criteriaKey]: newLevel
              }
            };
          }
          return post;
        }));
      };

      const getRatingBadgeClass = (rating) => {
        switch (rating) {
          case 'Exemplary':
            return 'bg-emerald-950 text-emerald-300 border-emerald-700';
          case 'Proficient':
            return 'bg-blue-950 text-blue-300 border-blue-700';
          case 'Developing':
            return 'bg-amber-950 text-amber-300 border-amber-700';
          case 'Needs Improvement':
            return 'bg-rose-950 text-rose-300 border-rose-700';
          default:
            return 'bg-slate-800 text-slate-300 border-slate-700';
        }
      };

      return (
        <div class="space-y-6">
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-pink-950/40 border-pink-800/60' : 'bg-pink-50 border-pink-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-pink-600/30 text-pink-300 border-pink-500/30' : 'bg-pink-100 text-pink-800 border-pink-300'}`}>
              Section 6: Anonymous Peer Critique & Discussion Board
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Anonymous Peer Review & Synthesis Padlet</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-pink-200/80' : 'text-pink-900/80'}`}>
              Publish synthesis drafts anonymously, evaluate peer work across a 4-point rating scale, and leave constructive peer feedback.
            </p>
          </div>

          <div class={`p-5 rounded-2xl border space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
            <h3 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
              Detailed Peer Assessment Rating Scale (Exemplary to Needs Improvement)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
              {Object.entries(peerRubricDescriptors).map(([key, desc]) => (
                <div key={key} class={`p-3 rounded-xl border space-y-2 ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                  <span class="font-bold text-pink-500 block text-[11px]">{desc.label}</span>
                  <div class="space-y-1 text-[10px]">
                    <p class="text-emerald-400 font-medium">&bull; {desc.levels['Exemplary']}</p>
                    <p class="text-blue-400 font-medium">&bull; {desc.levels['Proficient']}</p>
                    <p class="text-amber-400 font-medium">&bull; {desc.levels['Developing']}</p>
                    <p class="text-rose-400 font-medium">&bull; {desc.levels['Needs Improvement']}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <form onSubmit={handlePublishPost} class={`p-5 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
            <div class="flex items-center justify-between">
              <h3 class={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Post Anonymous Synthesis Card</h3>
              <span class="text-[10px] text-pink-400 bg-pink-950/60 border border-pink-800/60 px-2 py-0.5 rounded-full">
                Privacy Guard: Author Identity Masked
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input
                type="text"
                placeholder="Synthesis Title..."
                value={newPostTitle}
                onChange={(e) => setNewPostTitle(e.target.value)}
                class={`rounded-xl px-3 py-2 text-xs border focus:outline-none focus:border-pink-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
              />

              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">Self Rating:</span>
                <select
                  value={newPostSelfRating}
                  onChange={(e) => setNewPostSelfRating(e.target.value)}
                  class={`flex-1 rounded-xl px-2.5 py-1.5 text-xs font-bold border focus:outline-none focus:border-pink-500 ${
                    isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'
                  }`}
                >
                  <option value="Exemplary">Exemplary (Level 4)</option>
                  <option value="Proficient">Proficient (Level 3)</option>
                  <option value="Developing">Developing (Level 2)</option>
                  <option value="Needs Improvement">Needs Improvement (Level 1)</option>
                </select>
              </div>
            </div>

            <textarea
              rows="3"
              placeholder="Paste your synthesis narrative to receive anonymous peer feedback..."
              value={newPostContent}
              onChange={(e) => setNewPostContent(e.target.value)}
              class={`w-full rounded-xl p-3 text-xs border focus:outline-none focus:border-pink-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
            ></textarea>

            <button
              type="submit"
              class="px-5 py-2.5 bg-pink-600 hover:bg-pink-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
            >
              + Publish Anonymous Card to Padlet Board
            </button>
          </form>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {padletPosts.map((post) => (
              <div key={post.id} class={`p-5 rounded-2xl border space-y-4 flex flex-col justify-between ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <div class="space-y-3">
                  <div class="flex items-center justify-between border-b pb-2 border-slate-700/50">
                    <div>
                      <h4 class={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{post.title}</h4>
                      <p class="text-[10px] text-slate-400">Author: <strong class="text-pink-400">{post.author}</strong></p>
                    </div>
                    <span class={`px-2.5 py-1 rounded-full text-[10px] font-bold border ${getRatingBadgeClass(post.selfRating)}`}>
                      Self: {post.selfRating}
                    </span>
                  </div>

                  <p class={`text-xs leading-relaxed font-sans ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>"{post.content}"</p>

                  <div class={`p-3 rounded-xl border text-[10px] space-y-2 ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <span class="font-bold text-slate-400 uppercase tracking-wider block">Peer Evaluation Ratings (4-Point Scale):</span>
                    
                    {['evidence', 'integration', 'critiqueQuality'].map((key) => {
                      const labelMap = { evidence: '1. Evidence Grounding', integration: '2. Synthesis', critiqueQuality: '3. Critique Quality' };
                      const currentVal = post.rubricFeedback?.[key] || 'Proficient';
                      return (
                        <div key={key} class="flex items-center justify-between gap-2">
                          <span class="text-slate-300 font-medium">{labelMap[key]}:</span>
                          <select
                            value={currentVal}
                            onChange={(e) => handleUpdatePeerRubric(post.id, key, e.target.value)}
                            class={`px-2 py-0.5 rounded text-[10px] font-bold border ${getRatingBadgeClass(currentVal)}`}
                          >
                            <option value="Exemplary">Exemplary</option>
                            <option value="Proficient">Proficient</option>
                            <option value="Developing">Developing</option>
                            <option value="Needs Improvement">Needs Improvement</option>
                          </select>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div class="pt-3 border-t border-slate-700/50 space-y-3">
                  <div class="flex items-center justify-between text-xs">
                    <button
                      onClick={() => handleLikePost(post.id)}
                      class="flex items-center gap-1.5 text-pink-500 font-bold hover:text-pink-400 transition-colors"
                    >
                      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                      <span>{post.likes} Helpful Critiques</span>
                    </button>
                    <span class="text-slate-400 text-[10px]">{post.comments.length} Comments</span>
                  </div>

                  <div class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar">
                    {post.comments.map(c => (
                      <div key={c.id} class={`p-2 rounded-lg text-[11px] space-y-0.5 ${isDarkMode ? 'bg-slate-950/80 border border-slate-800 text-slate-300' : 'bg-slate-100 border border-slate-200 text-slate-700'}`}>
                        <strong class="text-pink-400 block text-[10px]">{c.author}:</strong>
                        <p>{c.text}</p>
                      </div>
                    ))}
                  </div>

                  <div class="flex gap-2">
                    <input
                      type="text"
                      placeholder="Add anonymous peer critique..."
                      value={commentInputs[post.id] || ''}
                      onChange={(e) => setCommentInputs({ ...commentInputs, [post.id]: e.target.value })}
                      class={`flex-1 rounded-xl px-3 py-1.5 text-xs border focus:outline-none focus:border-pink-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                    />
                    <button
                      onClick={() => handleAddComment(post.id)}
                      class="px-3 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-semibold text-xs rounded-xl shadow transition-all shrink-0"
                    >
                      Critique
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // 6.5 FEEDBACK SUMMARY & EVALUATION HUB SECTION
    // ==========================================
    function FeedbackSummarySection({ synthesisTitle, synthesisText, teacherFeedback, rubricScores, isDarkMode, setActiveTab }) {
      const teacherGrade = teacherFeedback?.grade || 'Not Graded Yet';
      const teacherComments = teacherFeedback?.comments || 'No official qualitative comments recorded yet by instructor.';

      return (
        <div class="space-y-6">
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-teal-950/40 border-teal-800/60' : 'bg-teal-50 border-teal-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-teal-600/30 text-teal-300 border-teal-500/30' : 'bg-teal-100 text-teal-800 border-teal-300'}`}>
              Section 7: Multi-Source Feedback & Evaluation Hub
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Integrated Feedback Dashboard</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-teal-200/80' : 'text-teal-900/80'}`}>
              Comprehensive consolidation of Teacher Evaluation, AI Writing Diagnostics, and Peer Review Ratings to guide final literature synthesis revisions.
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* 1. Teacher Evaluation Summary Card */}
            <div class={`p-5 rounded-2xl border space-y-3 flex flex-col justify-between ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
              <div class="space-y-2">
                <div class="flex items-center justify-between border-b pb-2 border-slate-700/50">
                  <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">1. Teacher Assessment</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-950 text-purple-300 border border-purple-700">
                    Grade: {teacherGrade}
                  </span>
                </div>
                <h4 class={`text-xs font-semibold ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}>Instructor Diagnostic Feedback</h4>
                <p class={`text-xs leading-relaxed italic ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                  "{teacherComments}"
                </p>
              </div>

              <div class={`p-3 rounded-xl border text-[11px] space-y-1 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-400' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                <div class="flex justify-between">
                  <span>Self-Rubric Total:</span>
                  <span class="font-bold text-teal-400">{Object.values(rubricScores).reduce((a, b) => a + b, 0)} / 16</span>
                </div>
                <div class="flex justify-between">
                  <span>Review Status:</span>
                  <span class="font-bold text-emerald-400">{teacherFeedback?.reviewedAt ? 'Reviewed' : 'Pending Teacher Sync'}</span>
                </div>
              </div>
            </div>

            {/* 2. AI Writing Coach Diagnostics Card */}
            <div class={`p-5 rounded-2xl border space-y-3 flex flex-col justify-between ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
              <div class="space-y-2">
                <div class="flex items-center justify-between border-b pb-2 border-slate-700/50">
                  <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">2. AI Coach Diagnostics</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-950 text-indigo-300 border border-indigo-700">
                    AI Scanned
                  </span>
                </div>
                <h4 class={`text-xs font-semibold ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}>Automated Writing Audit</h4>
                <ul class={`text-xs space-y-1.5 ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                  <li class="flex items-start gap-1.5">
                    <span class="text-emerald-400 font-bold">&check;</span>
                    <span><strong>Citation Alignment:</strong> Parenthetical citations detected across local & foreign sources.</span>
                  </li>
                  <li class="flex items-start gap-1.5">
                    <span class="text-amber-400 font-bold">&bull;</span>
                    <span><strong>Structural Balance:</strong> Ensure thematic matrix items in Section 4 are equally cited.</span>
                  </li>
                  <li class="flex items-start gap-1.5">
                    <span class="text-blue-400 font-bold">&check;</span>
                    <span><strong>Academic Tone:</strong> Passive/active voice consistency meets university criteria.</span>
                  </li>
                </ul>
              </div>

              <button
                onClick={() => setActiveTab('synthesis')}
                class="w-full py-2 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/40 font-semibold text-xs rounded-xl transition-all"
              >
                Re-run AI Writing Audit &rarr;
              </button>
            </div>

            {/* 3. Peer Padlet Feedback Summary Card */}
            <div class={`p-5 rounded-2xl border space-y-3 flex flex-col justify-between ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
              <div class="space-y-2">
                <div class="flex items-center justify-between border-b pb-2 border-slate-700/50">
                  <span class="text-xs font-bold text-pink-400 uppercase tracking-wider">3. Peer Padlet Ratings</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-pink-950 text-pink-300 border border-pink-700">
                    Anonymous Feedback
                  </span>
                </div>
                <h4 class={`text-xs font-semibold ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}>Peer Critique Consensus</h4>
                <div class="space-y-2 text-xs">
                  <div class="flex justify-between items-center">
                    <span className="text-slate-400">Evidence Grounding:</span>
                    <span class="font-bold text-emerald-400">Proficient (L3)</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span className="text-slate-400">Thematic Synthesis:</span>
                    <span class="font-bold text-blue-400">Exemplary (L4)</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span className="text-slate-400">Critique Depth:</span>
                    <span class="font-bold text-amber-400">Developing (L2)</span>
                  </div>
                </div>
              </div>

              <button
                onClick={() => setActiveTab('padlet')}
                class="w-full py-2 bg-pink-600/20 hover:bg-pink-600/40 text-pink-300 border border-pink-500/40 font-semibold text-xs rounded-xl transition-all"
              >
                View Community Padlet Posts &rarr;
              </button>
            </div>
          </div>

          {/* Action Plan Checklist */}
          <div class={`p-5 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
            <h3 class={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Synthesis Revision Action Plan</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <div class={`p-3 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                <strong class="text-teal-400 block mb-1">Step A: Address Teacher Notes</strong>
                Incorporate instructor feedback on methodology contrast between local & foreign papers.
              </div>
              <div class={`p-3 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                <strong class="text-indigo-400 block mb-1">Step B: Refine AI Suggestions</strong>
                Polish passive sentences flagged during AI coach text parsing.
              </div>
              <div class={`p-3 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                <strong class="text-pink-400 block mb-1">Step C: Finalize Citations</strong>
                Ensure all tagged statements in Section 4 carry matching in-text parenthetical references.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. TEACHER FEEDBACK PORTAL
    // ==========================================
    function TeacherFeedbackPortal({
      studies,
      userThemes,
      themeAssignments,
      synthesisTitle,
      synthesisText,
      rubricScores,
      submissionStatus,
      setSubmissionStatus,
      teacherFeedback,
      setTeacherFeedback,
      userName,
      isDarkMode
    }) {
      const [customFeedbackText, setCustomFeedbackText] = useState(teacherFeedback.comments || '');
      const [customGrade, setCustomGrade] = useState(teacherFeedback.grade || 'A');

      const handleSaveTeacherReview = (e) => {
        e.preventDefault();
        setTeacherFeedback({
          grade: customGrade,
          comments: customFeedbackText.trim(),
          reviewedAt: Date.now()
        });
        setSubmissionStatus('reviewed');
      };

      return (
        <div class="space-y-6">
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-purple-950/40 border-purple-800/60' : 'bg-purple-50 border-purple-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-purple-600/30 text-purple-300 border-purple-500/30' : 'bg-purple-100 text-purple-800 border-purple-300'}`}>
              Section 7: Teacher Review & Live Feedback Portal
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Instructor Diagnostic Review & Grade Sync</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-purple-200/80' : 'text-purple-900/80'}`}>
              Review submitted student literature syntheses, inspect active thematic matrices, and return qualitative feedback.
            </p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 space-y-4">
              <div class={`p-5 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <div class="flex items-center justify-between border-b pb-3 border-slate-700/50">
                  <div>
                    <h3 class={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{synthesisTitle || 'Synthesis Submission'}</h3>
                    <p class="text-[11px] text-slate-400">Student: <strong>{userName}</strong></p>
                  </div>
                  <span class={`px-3 py-1 rounded-full text-xs font-bold ${
                    submissionStatus === 'reviewed' 
                      ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' 
                      : submissionStatus === 'submitted' 
                        ? 'bg-amber-950 text-amber-300 border border-amber-700' 
                        : 'bg-slate-800 text-slate-400'
                  }`}>
                    Status: {submissionStatus.toUpperCase()}
                  </span>
                </div>

                <div class={`p-4 rounded-xl border text-xs leading-relaxed max-h-96 overflow-y-auto ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-800'}`}>
                  {synthesisText || 'No synthesis narrative submitted yet.'}
                </div>
              </div>

              <div class={`p-5 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Student Self-Evaluation Rubric Scores</h4>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <div class={`p-3 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <span class="text-slate-400 block text-[10px]">1. Thematic Integration:</span>
                    <strong class="text-indigo-400 text-sm">{rubricScores.thematicIntegration} / 4</strong>
                  </div>
                  <div class={`p-3 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <span class="text-slate-400 block text-[10px]">2. Critical Synthesis:</span>
                    <strong class="text-indigo-400 text-sm">{rubricScores.criticalSynthesis} / 4</strong>
                  </div>
                  <div class={`p-3 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <span class="text-slate-400 block text-[10px]">3. Academic Tone:</span>
                    <strong class="text-indigo-400 text-sm">{rubricScores.academicTone} / 4</strong>
                  </div>
                  <div class={`p-3 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <span class="text-slate-400 block text-[10px]">4. Citation Accuracy:</span>
                    <strong class="text-indigo-400 text-sm">{rubricScores.citationAccuracy} / 4</strong>
                  </div>
                </div>
              </div>
            </div>

            <div class="lg:col-span-5 space-y-4">
              <form onSubmit={handleSaveTeacherReview} class={`p-5 rounded-2xl border space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Provide Teacher Feedback & Grade</h4>

                <div class="space-y-1">
                  <label class="text-xs text-slate-400">Assign Grade / Mark:</label>
                  <select
                    value={customGrade}
                    onChange={(e) => setCustomGrade(e.target.value)}
                    class={`w-full rounded-xl p-2.5 text-xs font-bold border focus:outline-none focus:border-purple-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                  >
                    <option value="A+ (Exemplary)">A+ (Exemplary)</option>
                    <option value="A (Proficient)">A (Proficient)</option>
                    <option value="B (Developing)">B (Developing)</option>
                    <option value="Needs Revision">Needs Revision</option>
                  </select>
                </div>

                <div class="space-y-1">
                  <label class="text-xs text-slate-400">Qualitative Feedback Notes:</label>
                  <textarea
                    rows="5"
                    placeholder="Provide specific feedback on empirical grounding, thematic integration, or sentence structure..."
                    value={customFeedbackText}
                    onChange={(e) => setCustomFeedbackText(e.target.value)}
                    class={`w-full rounded-xl p-3 text-xs border focus:outline-none focus:border-purple-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                  ></textarea>
                </div>

                <button
                  type="submit"
                  class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
                >
                  Save & Sync Teacher Review
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // Render React Application Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
