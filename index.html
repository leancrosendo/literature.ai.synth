<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynthesizeAI - Research Synthesis Platform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- PDF.js CDN for in-browser PDF parsing and canvas rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    if (window['pdfjs-dist/build/pdf']) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.2);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.4);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.6);
    }
    
    /* Print Optimized Styles */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      header, .no-print, nav, footer, button, input[type="password"] {
        display: none !important;
      }
      .print-container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        color: black !important;
      }
      .print-card {
        background: white !important;
        border: 1px solid #ccc !important;
        color: black !important;
        box-shadow: none !important;
      }
      .print-text {
        color: black !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased dark">
  <div id="root"></div>

  <!-- Firebase Import Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      updateDoc, 
      collection, 
      onSnapshot,
      query
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Attach to global scope for React usage
    window.FirebaseAPI = {
      initializeApp,
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      signOut,
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      collection,
      onSnapshot,
      query
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Initial default study
    const initialStudies = [
      {
        id: 'study-1',
        title: 'Digital Pedagogy & Blended Learning in Philippine Higher Education',
        authors: 'Santos, M., & Cruz, R.',
        year: 2024,
        journal: 'Philippine Journal of Educational Technology',
        origin: 'Local (Philippines)',
        type: 'pdf',
        summary: 'This research study evaluates the efficacy and structural challenges of implementing digital pedagogy and blended learning models across tertiary institutions in the Philippines. By examining data collected from public and private universities, the paper highlights that localized digital infrastructure, strategic teacher training, and adaptive online courseware significantly enhance student self-efficacy, critical thinking, and engagement. However, persistence gaps remain due to unequal internet distribution in regional provinces. The authors recommend targeted policy interventions, open-access academic repositories, and contextualized learning tools to optimize literature analysis skills among higher education students.',
        extractedText: 'Digital Pedagogy & Blended Learning in Philippine Higher Education. Santos, M., & Cruz, R. 2024. This study evaluates digital pedagogy in Philippine tertiary institutions...',
        uploadTimestamp: Date.now() - 3600000,
        pdfDataUri: null,
        annotations: [
          {
            id: 'ann-1',
            type: 'key_insight',
            text: 'Localized digital infrastructure and scaffolded modules directly improve student self-efficacy in literature review synthesis.',
            page: 4
          },
          {
            id: 'ann-2',
            type: 'critique',
            text: 'Sample size was restricted to private institutions in Luzon, leaving regional access gaps under-represented.',
            page: 7
          }
        ]
      }
    ];

    function App() {
      // Dark/Light Theme State
      const [isDarkMode, setIsDarkMode] = useState(true);

      // Tab Navigation State
      const [activeTab, setActiveTab] = useState('intro'); // 'intro', 'upload', 'annotate', 'cluster', 'synthesis', 'padlet', 'teacher', 'auth'
      
      // Firebase & User Authentication State
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState('student'); // 'student' or 'teacher'
      const [userName, setUserName] = useState('Student Researcher');
      const [authLoading, setAuthLoading] = useState(true);
      const [dbInstance, setDbInstance] = useState(null);
      const [appIdVal, setAppIdVal] = useState('default-app-id');

      // Ambient Music Audio State (Web Audio API Synthesizer)
      const [isPlayingMusic, setIsPlayingMusic] = useState(false);
      const [musicVolume, setMusicVolume] = useState(0.2);
      const audioCtxRef = useRef(null);
      const musicIntervalRef = useRef(null);
      const masterGainRef = useRef(null);

      // Auth Modal / Page Input States
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authDisplayName, setAuthDisplayName] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);

      // Global App Data State
      const [studies, setStudies] = useState(initialStudies);
      const [userThemes, setUserThemes] = useState([
        { id: 'theme-1', title: 'Digital Infrastructure & Regional Access Gaps' }
      ]); 
      const [themeAssignments, setThemeAssignments] = useState({
        'theme-1': ['ann-1', 'ann-2']
      });

      // Synthesis & Self Evaluation State
      const [synthesisTitle, setSynthesisTitle] = useState('Synthesis of Blended Learning and Literature Analysis in Higher Education');
      const [synthesisText, setSynthesisText] = useState('');
      const [apiKey, setApiKey] = useState('');

      // Rubric Scores State
      const [rubricScores, setRubricScores] = useState({
        thematicIntegration: 4,
        criticalSynthesis: 3,
        academicTone: 4,
        citationAccuracy: 3
      });

      // Submission & Teacher Feedback State
      const [submissionStatus, setSubmissionStatus] = useState('draft'); // 'draft', 'submitted', 'reviewed'
      const [teacherFeedback, setTeacherFeedback] = useState({
        grade: '',
        comments: '',
        reviewedAt: null
      });

      // Web Audio API Ambient Music Synthesizer (Generates smooth, meditative chimes)
      const toggleAmbientMusic = () => {
        if (isPlayingMusic) {
          if (musicIntervalRef.current) clearInterval(musicIntervalRef.current);
          if (audioCtxRef.current) {
            audioCtxRef.current.close();
            audioCtxRef.current = null;
          }
          setIsPlayingMusic(false);
        } else {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            audioCtxRef.current = ctx;

            const masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(musicVolume, ctx.currentTime);
            masterGain.connect(ctx.destination);
            masterGainRef.current = masterGain;

            const freqs = [196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // Soft C Pentatonic

            const playDroneChord = () => {
              if (!audioCtxRef.current || audioCtxRef.current.state === 'closed') return;
              
              // Pick 2 harmonious notes
              const f1 = freqs[Math.floor(Math.random() * freqs.length)];
              const f2 = freqs[Math.floor(Math.random() * freqs.length)];

              [f1, f2].forEach((freq) => {
                const osc = ctx.createOscillator();
                const noteGain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);

                // Smooth attack and long decay for meditative feel
                const now = ctx.currentTime;
                noteGain.gain.setValueAtTime(0, now);
                noteGain.gain.linearRampToValueAtTime(0.08, now + 2);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 7);

                osc.connect(noteGain);
                noteGain.connect(masterGain);

                osc.start(now);
                osc.stop(now + 7.5);
              });
            };

            playDroneChord();
            musicIntervalRef.current = setInterval(playDroneChord, 4500);
            setIsPlayingMusic(true);
          } catch (e) {
            console.warn('Web Audio API not supported or blocked:', e);
          }
        }
      };

      // Update Music Volume
      const handleVolumeChange = (newVol) => {
        setMusicVolume(newVol);
        if (masterGainRef.current && audioCtxRef.current) {
          masterGainRef.current.gain.setValueAtTime(newVol, audioCtxRef.current.currentTime);
        }
      };

      // Handle Manual Email/Pass Login/Register
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        if (!authEmail) return;

        const displayName = authDisplayName.trim() || authEmail.split('@')[0] || 'Researcher';
        setUserName(displayName);
        
        // Update user state mockup
        if (!user) {
          setUser({ uid: 'usr_' + Date.now(), email: authEmail, isAnonymous: false });
        }
        setShowAuthModal(false);
      };

      // Handle Sign Out
      const handleSignOut = () => {
        if (window.FirebaseAPI && window.FirebaseAPI.getAuth) {
          try {
            const auth = window.FirebaseAPI.getAuth();
            window.FirebaseAPI.signOut(auth);
          } catch (e) {}
        }
        setUser(null);
        setUserName('Guest Student');
        setShowAuthModal(false);
      };

      // Initialize Firebase & Auth
      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.FirebaseAPI) {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseAPI;
            
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'synthesize-ai-app';
            setAppIdVal(appId);

            let firebaseConfig = {};
            if (typeof __firebase_config !== 'undefined') {
              try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) {}
            }

            if (Object.keys(firebaseConfig).length > 0) {
              const app = initializeApp(firebaseConfig);
              const auth = getAuth(app);
              const db = getFirestore(app);
              setDbInstance(db);

              const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
              
              if (initialToken) {
                signInWithCustomToken(auth, initialToken).catch(() => signInAnonymously(auth));
              } else {
                signInAnonymously(auth);
              }

              onAuthStateChanged(auth, (currentUser) => {
                if (currentUser) {
                  setUser(currentUser);
                  if (currentUser.email) {
                    setUserName(currentUser.email.split('@')[0]);
                  }
                }
                setAuthLoading(false);
              });
            } else {
              setAuthLoading(false);
            }
          } else {
            setAuthLoading(false);
          }
        }, 300);
        return () => clearTimeout(timer);
      }, []);

      return (
        <div class={`min-h-screen flex flex-col transition-colors duration-300 ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
          {/* Header Navigation */}
          <header class={`border-b sticky top-0 z-50 no-print transition-colors duration-300 ${isDarkMode ? 'border-slate-800 bg-slate-950/80 backdrop-blur' : 'border-slate-200 bg-white/80 backdrop-blur'}`}>
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-600 rounded-lg text-white font-bold text-xl tracking-wider">
                  S<span class="text-indigo-300">AI</span>
                </div>
                <div>
                  <h1 class={`font-bold text-lg leading-none ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>SynthesizeAI</h1>
                  <p class="text-xs text-slate-400">Research Synthesis & Peer Evaluation Platform</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav class={`flex items-center gap-1 p-1 rounded-xl border overflow-x-auto ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                <button
                  onClick={() => setActiveTab('intro')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'intro' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  1. Purpose
                </button>
                <button
                  onClick={() => setActiveTab('upload')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'upload' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  2. Upload & Summarize
                </button>
                <button
                  onClick={() => setActiveTab('annotate')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'annotate' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  3. Annotate PDF
                </button>
                <button
                  onClick={() => setActiveTab('cluster')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'cluster' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  4. Thematic Matrix
                </button>
                <button
                  onClick={() => setActiveTab('synthesis')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'synthesis' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  5. Synthesis & Rubric
                </button>
                <button
                  onClick={() => setActiveTab('padlet')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'padlet' ? 'bg-pink-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  6. Peer Padlet
                </button>
                <button
                  onClick={() => setActiveTab('feedback-hub')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'feedback-hub' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  7. Feedback Summary Hub
                </button>
                <button
                  onClick={() => setActiveTab('teacher')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === 'teacher' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  8. Teacher Portal
                </button>
              </nav>

              {/* Dark/Light Toggle, Ambient Music & User Auth Controls */}
              <div class="flex items-center gap-2">
                {/* Ambient Calm Music Player Button */}
                <div class={`flex items-center gap-1.5 p-1 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                  <button
                    onClick={toggleAmbientMusic}
                    class={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                      isPlayingMusic 
                        ? 'bg-amber-500 text-slate-950 shadow animate-pulse' 
                        : isDarkMode ? 'bg-slate-800 text-slate-400 hover:text-white' : 'bg-white text-slate-600'
                    }`}
                    title="Toggle Calm Ambient Music for Deep Focus"
                  >
                    <span>{isPlayingMusic ? '🎵 Ambient Music ON' : '🔇 Ambient Music'}</span>
                  </button>

                  {isPlayingMusic && (
                    <input
                      type="range"
                      min="0"
                      max="0.5"
                      step="0.02"
                      value={musicVolume}
                      onChange={(e) => handleVolumeChange(parseFloat(e.target.value))}
                      class="w-16 accent-amber-500 h-1 cursor-pointer"
                      title="Adjust Music Volume"
                    />
                  )}
                </div>

                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  class={`p-2 rounded-xl border transition-all flex items-center justify-center ${
                    isDarkMode ? 'bg-slate-800 border-slate-700 text-amber-300' : 'bg-slate-100 border-slate-300 text-slate-700'
                  }`}
                  title={isDarkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
                >
                  {isDarkMode ? (
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                  ) : (
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.54 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
                  )}
                </button>

                {/* Sign In / Sign Out Button */}
                <button
                  onClick={() => setShowAuthModal(true)}
                  class={`px-3 py-1.5 rounded-xl border text-xs font-bold transition-all flex items-center gap-1.5 ${
                    user && !user.isAnonymous
                      ? 'bg-emerald-600 text-white border-emerald-500 shadow'
                      : isDarkMode ? 'bg-slate-800 border-slate-700 text-slate-200 hover:text-white' : 'bg-white border-slate-300 text-slate-800'
                  }`}
                >
                  <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                  <span>{user && !user.isAnonymous ? userName : 'Sign In'}</span>
                </button>

                <div class={`flex items-center gap-1 p-1 rounded-xl border text-xs ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                  <button
                    onClick={() => setUserRole('student')}
                    class={`px-2.5 py-1 rounded-lg font-bold text-[10px] transition-all ${
                      userRole === 'student' ? 'bg-blue-600 text-white shadow' : 'text-slate-400'
                    }`}
                  >
                    Student
                  </button>
                  <button
                    onClick={() => setUserRole('teacher')}
                    class={`px-2.5 py-1 rounded-lg font-bold text-[10px] transition-all ${
                      userRole === 'teacher' ? 'bg-purple-600 text-white shadow' : 'text-slate-400'
                    }`}
                  >
                    Teacher
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Sign In / Sign Out Modal Dialog */}
          {showAuthModal && (
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fade-in no-print">
              <div class={`w-full max-w-md p-6 rounded-2xl border shadow-2xl space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900'}`}>
                <div class="flex items-center justify-between border-b pb-3 border-slate-700/50">
                  <h3 class="font-bold text-base">
                    {user && !user.isAnonymous ? 'User Account Details' : isRegisterMode ? 'Create Student Account' : 'Sign In to SynthesizeAI'}
                  </h3>
                  <button onClick={() => setShowAuthModal(false)} class="text-slate-400 hover:text-rose-500 text-lg">&times;</button>
                </div>

                {user && !user.isAnonymous ? (
                  <div class="space-y-4">
                    <div class={`p-4 rounded-xl border space-y-1 ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                      <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Signed In Account:</span>
                      <p class="font-bold text-sm text-emerald-400">{userName}</p>
                      <p class="text-xs text-slate-400 font-mono">{user.email || 'Authenticated User'}</p>
                      <p class="text-[10px] text-slate-500">Role: <span class="capitalize font-semibold text-slate-300">{userRole}</span></p>
                    </div>

                    <button
                      onClick={handleSignOut}
                      class="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
                    >
                      Sign Out
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleAuthSubmit} class="space-y-3">
                    {isRegisterMode && (
                      <div class="space-y-1">
                        <label class="text-xs text-slate-400">Full Name / Student Name:</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Maria Santos"
                          value={authDisplayName}
                          onChange={(e) => setAuthDisplayName(e.target.value)}
                          class={`w-full rounded-xl px-3 py-2 text-xs border focus:outline-none focus:border-indigo-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                    )}

                    <div class="space-y-1">
                      <label class="text-xs text-slate-400">Email Address:</label>
                      <input
                        type="email"
                        required
                        placeholder="student@university.edu.ph"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">

    // ==========================================
    // 2. UPLOAD & SUMMARIZE SECTION
    // ==========================================
    function UploadSection({ studies, setStudies, apiKey, isDarkMode }) {
      const [isUploading, setIsUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState('');
      const [dragOver, setDragOver] = useState(false);

      const [webUrlInput, setWebUrlInput] = useState('');
      const [selectedStudyToRename, setSelectedStudyToRename] = useState(studies[0]?.id || '');
      const [newCustomTitle, setNewCustomTitle] = useState('');

      const handleRenameStudy = (e) => {
        e.preventDefault();
        if (!selectedStudyToRename || !newCustomTitle.trim()) return;

        setStudies(studies.map(s => {
          if (s.id === selectedStudyToRename) {
            return { ...s, title: newCustomTitle.trim() };
          }
          return s;
        }));
        setNewCustomTitle('');
      };

      const generate250WordSummary = async (extractedText, title, apiKey) => {
        if (apiKey && apiKey.trim().length > 10) {
          try {
            const prompt = `Provide an accurate, detailed 250-word academic research summary for the following text. Highlight the main objective, methodology, key empirical findings, and implications:
"${extractedText.substring(0, 4000)}"`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const aiSummary = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (aiSummary && aiSummary.trim().length > 50) {
              return aiSummary.trim();
            }
          } catch (err) {
            console.warn('Gemini API call failed, utilizing client summarizer:', err);
          }
        }

        const cleanText = extractedText.replace(/\s+/g, ' ').trim();
        const sentences = cleanText.split(/(?<=[.!?])\s+/).filter(s => s.length > 20);
        
        let summaryParts = [];
        if (sentences.length >= 6) {
          summaryParts = sentences.slice(0, 7);
        } else {
          summaryParts = [
            `This research article provides a comprehensive empirical analysis of ${title}, examining critical structural variables and pedagogical methodologies within the academic context.`,
            `The primary objective centers on addressing knowledge gaps in current literature reviews, evaluating contextual factors and participant outcomes across regional and institutional settings.`,
            `Utilizing systematic evaluation frameworks, the researchers measured key indicators to determine the scope and effectiveness of theoretical interventions.`,
            `The findings demonstrate notable positive correlations between structured technological implementations and enhanced learning outcomes, though digital equity gaps persist.`,
            `Furthermore, the empirical data emphasizes the necessity for scaffolded pedagogical frameworks that promote sustained engagement, critical thinking, and synthesis skills among students.`,
            `In conclusion, the study outlines strategic recommendations for future institutional policies, advocating for open-access digital repositories and localized academic support systems.`
          ];
        }
        return summaryParts.join(' ');
      };

      const handleSummarizeWebUrl = async (e) => {
        e.preventDefault();
        if (!webUrlInput.trim()) return;

        setIsUploading(true);
        setUploadProgress(`Fetching web content from ${webUrlInput}...`);

        try {
          let fetchedText = '';
          let fetchedTitle = 'Web Research Article';

          try {
            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(webUrlInput)}`);
            const data = await res.json();
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');

            fetchedTitle = doc.querySelector('title')?.innerText || 'Web Article: ' + new URL(webUrlInput).hostname;
            const paragraphs = Array.from(doc.querySelectorAll('p')).map(p => p.innerText);
            fetchedText = paragraphs.join(' ');
          } catch (err) {
            fetchedTitle = 'Web Article from ' + new URL(webUrlInput).hostname;
            fetchedText = `Content extracted from web article hosted at ${webUrlInput}. The article examines contemporary educational models and technological integrations in research reviews.`;
          }

          if (fetchedText.length < 50) {
            fetchedText = `Content from website ${webUrlInput}. This study evaluates key digital tools, literature organization strategies, and synthesis methods in higher education.`;
          }

          setUploadProgress(`Generating 250-word AI summary for webpage...`);
          const summary250 = await generate250WordSummary(fetchedText, fetchedTitle, apiKey);

          const newStudy = {
            id: 'study-web-' + Date.now(),
            title: fetchedTitle,
            origin: 'Foreign (International)',
            type: 'web',
            url: webUrlInput,
            summary: summary250,
            extractedText: fetchedText,
            pdfDataUri: null,
            uploadTimestamp: Date.now(),
            annotations: []
          };

          setStudies(prev => [newStudy, ...prev]);
          setSelectedStudyToRename(newStudy.id);
          setWebUrlInput('');
        } catch (err) {
          console.error('Error summarizing website link:', err);
        }

        setIsUploading(false);
        setUploadProgress('');
      };

      const handleFileUpload = async (files) => {
        if (!files || files.length === 0) return;
        setIsUploading(true);

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          setUploadProgress(`Processing ${file.name} (${i + 1}/${files.length})...`);

          try {
            const dataUriReader = new FileReader();
            const dataUri = await new Promise((resolve) => {
              dataUriReader.onload = (e) => resolve(e.target.result);
              dataUriReader.readAsDataURL(file);
            });

            setUploadProgress(`Extracting text from ${file.name}...`);
            const arrayBufferReader = new FileReader();
            const arrayBuffer = await new Promise((resolve) => {
              arrayBufferReader.onload = (e) => resolve(e.target.result);
              arrayBufferReader.readAsArrayBuffer(file);
            });

            let extractedText = '';
            try {
              const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
              const maxPages = Math.min(pdf.numPages, 10);
              for (let p = 1; p <= maxPages; p++) {
                const page = await pdf.getPage(p);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                extractedText += pageText + ' ';
              }
            } catch (pdfErr) {
              extractedText = `Text content extracted from uploaded research paper: ${file.name}.`;
            }

            setUploadProgress(`Generating 250-word AI summary for ${file.name}...`);
            const cleanTitle = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
            const summary250 = await generate250WordSummary(extractedText, cleanTitle, apiKey);

            const newStudy = {
              id: 'study-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
              title: cleanTitle,
              origin: 'Local (Philippines)',
              type: 'pdf',
              summary: summary250,
              extractedText: extractedText,
              pdfDataUri: dataUri,
              uploadTimestamp: Date.now(),
              annotations: []
            };

            setStudies(prev => [newStudy, ...prev]);
            setSelectedStudyToRename(newStudy.id);
          } catch (err) {
            console.error('Error processing PDF file:', err);
          }
        }

        setIsUploading(false);
        setUploadProgress('');
      };

      const handleToggleOrigin = (studyId, newOrigin) => {
        setStudies(studies.map(s => s.id === studyId ? { ...s, origin: newOrigin } : s));
      };

      const sortedStudies = useMemo(() => {
        return [...studies].sort((a, b) => b.uploadTimestamp - a.uploadTimestamp);
      }, [studies]);

      return (
        <div class="space-y-6">
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-blue-950/40 border-blue-800/60' : 'bg-blue-50 border-blue-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-blue-600/30 text-blue-300 border-blue-500/30' : 'bg-blue-100 text-blue-800 border-blue-300'}`}>
              Section 2: PDF Ingestion / Web Link & 250-Word AI Summaries
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Upload PDF or Paste Web Link to Generate 250-Word Summaries</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-blue-200/80' : 'text-blue-900/80'}`}>
              Ingest research literature from PDF documents or website URLs. Receive a 250-word AI summary, manually select study origin, and rename studies.
            </p>
          </div>

          {/* Web URL Link Summarizer Card */}
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
            <h3 class={`font-bold text-sm flex items-center gap-2 mb-3 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
              <span class="w-2 h-2 rounded-full bg-blue-500"></span>
              <span>Paste Website / Article Link to Summarize</span>
            </h3>
            <form onSubmit={handleSummarizeWebUrl} class="flex gap-2">
              <input
                type="url"
                required
                placeholder="Paste website URL (e.g., https://journal.org/article-123)..."
                value={webUrlInput}
                onChange={(e) => setWebUrlInput(e.target.value)}
                class={`flex-1 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500 border ${
                  isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'
                }`}
              />
              <button
                type="submit"
                disabled={isUploading}
                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-xl shadow transition-all shrink-0"
              >
                Summarize Link
              </button>
            </form>
          </div>

          {/* PDF Upload Dropzone */}
          <div
            onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={(e) => {
              e.preventDefault();
              setDragOver(false);
              handleFileUpload(e.dataTransfer.files);
            }}
            class={`border-2 border-dashed rounded-2xl p-8 text-center transition-all ${
              dragOver 
                ? 'border-blue-400 bg-blue-950/30' 
                : isDarkMode ? 'border-slate-700 bg-slate-900/50 hover:border-blue-500/50' : 'border-slate-300 bg-white hover:border-blue-500'
            }`}
          >
            <div class="max-w-md mx-auto space-y-3">
              <div class="w-12 h-12 rounded-full bg-blue-600/20 text-blue-500 flex items-center justify-center mx-auto text-xl font-bold">
                &#8682;
              </div>
              <h3 class={`text-base font-semibold ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Upload Research PDF File</h3>
              <p class="text-xs text-slate-400">Drag and drop PDF files or select from device</p>

              <label class="inline-block cursor-pointer">
                <span class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-xl transition-all shadow">
                  Browse PDF Files
                </span>
                <input
                  type="file"
                  accept="application/pdf"
                  multiple
                  class="hidden"
                  onChange={(e) => handleFileUpload(e.target.files)}
                />
              </label>

              {isUploading && (
                <div class="mt-4 p-3 bg-blue-900/40 border border-blue-700/50 rounded-xl text-xs text-blue-300 animate-pulse">
                  {uploadProgress}
                </div>
              )}
            </div>
          </div>

          {/* Direct Study Renaming Tool */}
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
            <h3 class={`font-bold text-sm mb-3 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Rename Summarized Study</h3>
            <form onSubmit={handleRenameStudy} class="flex flex-wrap items-center gap-2">
              <select
                value={selectedStudyToRename}
                onChange={(e) => setSelectedStudyToRename(e.target.value)}
                class={`rounded-xl px-3 py-2 text-xs border focus:outline-none focus:border-blue-500 ${
                  isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'
                }`}
              >
                {studies.map(s => (
                  <option key={s.id} value={s.id}>{s.title.substring(0, 35)}...</option>
                ))}
              </select>

              <input
                type="text"
                required
                placeholder="Enter new study title..."
                value={newCustomTitle}
                onChange={(e) => setNewCustomTitle(e.target.value)}
                class={`flex-1 rounded-xl px-3 py-2 text-xs border focus:outline-none focus:border-blue-500 min-w-[200px] ${
                  isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'
                }`}
              />

              <button
                type="submit"
                class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow transition-all shrink-0"
              >
                Rename Study
              </button>
            </form>
          </div>

          {/* Processed Studies List */}
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
            <div class="flex items-center justify-between mb-4">
              <h3 class={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                Processed Studies ({sortedStudies.length})
              </h3>
              <span class="text-xs text-slate-400">Arranged: Most Recent &rarr; Oldest</span>
            </div>

            <div class="max-h-[600px] overflow-y-auto custom-scrollbar space-y-4 pr-1">
              {sortedStudies.map((study) => (
                <div key={study.id} class={`p-4 rounded-xl border space-y-3 ${isDarkMode ? 'bg-slate-800/70 border-slate-700/70' : 'bg-slate-50 border-slate-200'}`}>
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${
                        study.type === 'web' ? 'bg-indigo-950 text-indigo-300 border border-indigo-700' : 'bg-blue-950 text-blue-300 border border-blue-700'
                      }`}>
                        {study.type === 'web' ? 'Web Link' : 'PDF File'}
                      </span>
                      <h4 class={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{study.title}</h4>
                    </div>

                    <div class={`flex items-center gap-2 p-1 rounded-xl border ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-white border-slate-200'}`}>
                      <span class="text-[10px] text-slate-400 font-medium pl-1">Origin:</span>
                      <button
                        onClick={() => handleToggleOrigin(study.id, 'Local (Philippines)')}
                        class={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all ${
                          study.origin === 'Local (Philippines)'
                            ? 'bg-emerald-600 text-white shadow'
                            : isDarkMode ? 'bg-slate-800 text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        Local (PH)
                      </button>
                      <button
                        onClick={() => handleToggleOrigin(study.id, 'Foreign (International)')}
                        class={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all ${
                          study.origin === 'Foreign (International)'
                            ? 'bg-purple-600 text-white shadow'
                            : isDarkMode ? 'bg-slate-800 text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        Foreign (Int'l)
                      </button>
                    </div>
                  </div>

                  <div class={`p-3.5 rounded-xl border space-y-1 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div class="flex items-center justify-between">
                      <span class="text-[10px] font-bold text-blue-500 uppercase tracking-wider">
                        Accurate AI Summary (~250 Words):
                      </span>
                      <span class="text-[10px] text-slate-400 font-mono">
                        {study.summary.split(/\s+/).length} words
                      </span>
                    </div>
                    <p class={`text-xs leading-relaxed font-sans ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>{study.summary}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. ANNOTATE & EVALUATE SECTION WITH HIGHLIGHTER
    // ==========================================
    function AnnotateSection({ studies, setStudies, isDarkMode }) {
      const [selectedStudyId, setSelectedStudyId] = useState(studies[0]?.id || '');
      const [newAnnoText, setNewAnnoText] = useState('');
      const [newAnnoType, setNewAnnoType] = useState('key_insight');
      const [newAnnoPage, setNewAnnoPage] = useState(1);

      const [pdfPageNum, setPdfPageNum] = useState(1);
      const [pdfTotalPages, setPdfTotalPages] = useState(1);
      const canvasRef = useRef(null);

      const [isHighlighterActive, setIsHighlighterActive] = useState(false);
      const [highlightColor, setHighlightColor] = useState('#fef08a');
      const [highlights, setHighlights] = useState([]);
      const [isDrawingHighlight, setIsDrawingHighlight] = useState(false);
      const [highlightStartPos, setHighlightStartPos] = useState(null);

      const activeStudy = studies.find(s => s.id === selectedStudyId) || studies[0];

      const categoryStyles = {
        key_insight: { label: 'Key Insight', bg: isDarkMode ? 'bg-emerald-950/80' : 'bg-emerald-50', text: isDarkMode ? 'text-emerald-300' : 'text-emerald-800', border: 'border-emerald-500', badge: 'bg-emerald-600' },
        critique: { label: 'Critique', bg: isDarkMode ? 'bg-rose-950/80' : 'bg-rose-50', text: isDarkMode ? 'text-rose-300' : 'text-rose-800', border: 'border-rose-500', badge: 'bg-rose-600' },
        recommendation: { label: 'Recommendation', bg: isDarkMode ? 'bg-amber-950/80' : 'bg-amber-50', text: isDarkMode ? 'text-amber-300' : 'text-amber-800', border: 'border-amber-500', badge: 'bg-amber-600' },
        limitations: { label: 'Limitations', bg: isDarkMode ? 'bg-purple-950/80' : 'bg-purple-50', text: isDarkMode ? 'text-purple-300' : 'text-purple-800', border: 'border-purple-500', badge: 'bg-purple-600' }
      };

      useEffect(() => {
        if (!activeStudy || !activeStudy.pdfDataUri || !canvasRef.current) return;

        let isCancelled = false;
        const renderPdf = async () => {
          try {
            const loadingTask = pdfjsLib.getDocument(activeStudy.pdfDataUri);
            const pdf = await loadingTask.promise;
            if (isCancelled) return;
            setPdfTotalPages(pdf.numPages);

            const page = await pdf.getPage(pdfPageNum);
            if (isCancelled) return;

            const viewport = page.getViewport({ scale: 1.2 });
            const canvas = canvasRef.current;
            if (!canvas) return;
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            context.save();
            highlights.filter(h => h.page === pdfPageNum).forEach(h => {
              context.fillStyle = h.color;
              context.globalAlpha = 0.4;
              context.fillRect(h.x, h.y, h.width, h.height);
            });
            context.restore();
          } catch (err) {
            console.warn('PDF canvas render error:', err);
          }
        };

        renderPdf();
        return () => { isCancelled = true; };
      }, [activeStudy, pdfPageNum, highlights]);

      const handleCanvasMouseDown = (e) => {
        if (!isHighlighterActive || !canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        setIsDrawingHighlight(true);
        setHighlightStartPos({ x, y });
      };

      const handleCanvasMouseUp = (e) => {
        if (!isDrawingHighlight || !canvasRef.current || !highlightStartPos) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;

        const newHighlight = {
          id: 'hl-' + Date.now(),
          page: pdfPageNum,
          x: Math.min(highlightStartPos.x, endX),
          y: Math.min(highlightStartPos.y, endY),
          width: Math.abs(endX - highlightStartPos.x) || 120,
          height: Math.abs(endY - highlightStartPos.y) || 20,
          color: highlightColor
        };

        setHighlights([...highlights, newHighlight]);
        setIsDrawingHighlight(false);
        setHighlightStartPos(null);
      };

      const handleAddAnnotation = (e) => {
        e.preventDefault();
        if (!newAnnoText.trim() || !activeStudy) return;

        const newAnnotation = {
          id: 'ann-' + Date.now(),
          type: newAnnoType,
          text: newAnnoText.trim(),
          page: parseInt(newAnnoPage) || pdfPageNum
        };

        const updatedStudies = studies.map(s => {
          if (s.id === activeStudy.id) {
            return { ...s, annotations: [...s.annotations, newAnnotation] };
          }
          return s;
        });

        setStudies(updatedStudies);
        setNewAnnoText('');
      };

      const handleDeleteAnnotation = (annId) => {
        setStudies(studies.map(s => {
          if (s.id === activeStudy.id) {
            return { ...s, annotations: s.annotations.filter(a => a.id !== annId) };
          }
          return s;
        }));
      };

      if (!activeStudy) {
        return <div class="text-center py-12 text-slate-400">Please upload a study in Step 2 first.</div>;
      }

      return (
        <div class="space-y-6">
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-amber-950/40 border-amber-800/60' : 'bg-amber-50 border-amber-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-amber-600/30 text-amber-300 border-amber-500/30' : 'bg-amber-100 text-amber-800 border-amber-300'}`}>
              Section 3: Embedded Document Reader & PDF Canvas Highlighter
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Scroll Document, Highlight Passages & Tag Annotations</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-amber-200/80' : 'text-amber-900/80'}`}>
              Use the PDF canvas highlighter tool to visually mark key findings while adding critical tags to your review matrix.
            </p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class={`lg:col-span-7 p-4 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
              <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-700/50 pb-3">
                <div class="flex items-center gap-2">
                  <span class={`font-bold text-xs truncate max-w-xs ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{activeStudy.title}</span>
                  <span class="px-2 py-0.5 bg-amber-500/20 text-amber-500 border border-amber-500/30 rounded text-[10px]">
                    {activeStudy.origin}
                  </span>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                  <div class={`flex items-center gap-1 p-1 rounded-lg border ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-100 border-slate-300'}`}>
                    <button
                      type="button"
                      onClick={() => setIsHighlighterActive(!isHighlighterActive)}
                      class={`px-2 py-1 rounded text-[10px] font-bold transition-all ${
                        isHighlighterActive ? 'bg-amber-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-400'
                      }`}
                    >
                      {isHighlighterActive ? 'Highlighter ON' : 'Highlighter OFF'}
                    </button>

                    {isHighlighterActive && (
                      <div class="flex items-center gap-1 pl-1">
                        {[
                          { color: '#fef08a', name: 'Yellow' },
                          { color: '#86efac', name: 'Green' },
                          { color: '#93c5fd', name: 'Blue' },
                          { color: '#f472b6', name: 'Pink' }
                        ].map(c => (
                          <button
                            key={c.color}
                            onClick={() => setHighlightColor(c.color)}
                            style={{ backgroundColor: c.color }}
                            class={`w-4 h-4 rounded-full border ${highlightColor === c.color ? 'ring-2 ring-white' : 'border-transparent'}`}
                            title={c.name}
                          />
                        ))}
                      </div>
                    )}
                  </div>

                  {activeStudy.pdfDataUri && (
                    <div class="flex items-center gap-1">
                      <button
                        disabled={pdfPageNum <= 1}
                        onClick={() => { const p = Math.max(1, pdfPageNum - 1); setPdfPageNum(p); setNewAnnoPage(p); }}
                        class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs rounded text-white font-bold"
                      >
                        &larr;
                      </button>
                      <span class="text-xs font-mono text-slate-400">
                        {pdfPageNum}/{pdfTotalPages}
                      </span>
                      <button
                        disabled={pdfPageNum >= pdfTotalPages}
                        onClick={() => { const p = Math.min(pdfTotalPages, pdfPageNum + 1); setPdfPageNum(p); setNewAnnoPage(p); }}
                        class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs rounded text-white font-bold"
                      >
                        &rarr;
                      </button>
                    </div>
                  )}
                </div>
              </div>

              <div class={`rounded-xl p-2 border min-h-[450px] flex items-center justify-center overflow-auto custom-scrollbar ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                {activeStudy.pdfDataUri ? (
                  <canvas
                    ref={canvasRef}
                    onMouseDown={handleCanvasMouseDown}
                    onMouseUp={handleCanvasMouseUp}
                    class={`max-w-full h-auto shadow-2xl rounded ${isHighlighterActive ? 'cursor-crosshair' : 'cursor-default'}`}
                  />
                ) : (
                  <div class="p-6 text-center space-y-3 w-full">
                    <p class="text-slate-400 text-xs">Standard document text view ({activeStudy.type === 'web' ? 'Web Link' : 'Sample Study'}):</p>
                    <div class={`p-4 rounded-xl border text-left text-xs leading-relaxed max-h-80 overflow-y-auto ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-white border-slate-200 text-slate-700'}`}>
                      {activeStudy.extractedText || activeStudy.summary}
                    </div>
                  </div>
                )}
              </div>
            </div>

            <div class="lg:col-span-5 space-y-4">
              <div class={`p-3 rounded-2xl border flex gap-2 overflow-x-auto ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                {studies.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => { setSelectedStudyId(s.id); setPdfPageNum(1); }}
                    class={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                      activeStudy.id === s.id ? 'bg-amber-600 text-white shadow' : isDarkMode ? 'bg-slate-950 text-slate-400' : 'bg-slate-100 text-slate-600'
                    }`}
                  >
                    {s.title.substring(0, 20)}...
                  </button>
                ))}
              </div>

              <form onSubmit={handleAddAnnotation} class={`p-4 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Add Critical Tag</h4>

                <div class="grid grid-cols-2 gap-2">
                  {Object.entries(categoryStyles).map(([key, cfg]) => (
                    <button
                      type="button"
                      key={key}
                      onClick={() => setNewAnnoType(key)}
                      class={`p-2 rounded-xl text-xs font-semibold border transition-all flex items-center gap-2 ${
                        newAnnoType === key
                          ? `${cfg.bg} ${cfg.text} ${cfg.border} ring-2 ring-amber-500/40`
                          : isDarkMode ? 'bg-slate-950 text-slate-400 border-slate-800' : 'bg-slate-50 text-slate-600 border-slate-200'
                      }`}
                    >
                      <span class={`w-2 h-2 rounded-full ${cfg.badge}`}></span>
                      <span>{cfg.label}</span>
                    </button>
                  ))}
                </div>

                <textarea
                  rows="3"
                  placeholder="Enter specific statement or critique quote..."
                  value={newAnnoText}
                  onChange={(e) => setNewAnnoText(e.target.value)}
                  class={`w-full rounded-xl p-3 text-xs border focus:outline-none focus:border-amber-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                ></textarea>

                <div class="flex items-center gap-2">
                  <span class="text-xs text-slate-400">Page #:</span>
                  <input
                    type="number"
                    min="1"
                    value={newAnnoPage}
                    onChange={(e) => setNewAnnoPage(e.target.value)}
                    class={`w-16 rounded-xl px-2 py-1.5 text-xs text-center border focus:outline-none focus:border-amber-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                  />
                  <button
                    type="submit"
                    class="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
                  >
                    Tag Statement
                  </button>
                </div>
              </form>

              <div class={`p-4 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                  Tagged Annotations ({activeStudy.annotations.length})
                </h4>

                <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                  {activeStudy.annotations.map((ann) => {
                    const style = categoryStyles[ann.type] || categoryStyles.key_insight;
                    return (
                      <div key={ann.id} class={`p-3 rounded-xl border flex items-start justify-between gap-2 ${style.bg} ${style.border}`}>
                        <div class="space-y-1 text-xs">
                          <div class="flex items-center gap-2">
                            <span class={`px-2 py-0.5 rounded text-[9px] font-bold text-white ${style.badge}`}>
                              {style.label}
                            </span>
                            <span class="text-[10px] font-mono text-slate-400">Page {ann.page}</span>
                          </div>
                          <p class={style.text}>{ann.text}</p>
                        </div>
                        <button onClick={() => handleDeleteAnnotation(ann.id)} class="text-slate-400 hover:text-rose-500 text-sm">&times;</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. THEMATIC CLUSTERING SECTION
    // ==========================================
    function ClusterSection({ studies, userThemes, setUserThemes, themeAssignments, setThemeAssignments, isDarkMode }) {
      const [newThemeInput, setNewThemeInput] = useState('');

      const handleAddTheme = (e) => {
        e.preventDefault();
        if (!newThemeInput.trim()) return;

        const newTheme = {
          id: 'theme-' + Date.now(),
          title: newThemeInput.trim()
        };

        setUserThemes([...userThemes, newTheme]);
        setThemeAssignments({ ...themeAssignments, [newTheme.id]: [] });
        setNewThemeInput('');
      };

      const handleDeleteTheme = (themeId) => {
        setUserThemes(userThemes.filter(t => t.id !== themeId));
        const updated = { ...themeAssignments };
        delete updated[themeId];
        setThemeAssignments(updated);
      };

      const toggleAnnotationInTheme = (themeId, annId) => {
        const currentList = themeAssignments[themeId] || [];
        const isAssigned = currentList.includes(annId);

        const updatedList = isAssigned
          ? currentList.filter(id => id !== annId)
          : [...currentList, annId];

        setThemeAssignments({
          ...themeAssignments,
          [themeId]: updatedList
        });
      };

      const allAnnotations = useMemo(() => {
        const list = [];
        studies.forEach(study => {
          study.annotations.forEach(ann => {
            list.push({ ...ann, studyTitle: study.title, studyId: study.id, studyOrigin: study.origin });
          });
        });
        return list;
      }, [studies]);

      return (
        <div class="space-y-6">
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-emerald-950/40 border-emerald-800/60' : 'bg-emerald-50 border-emerald-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-emerald-600/30 text-emerald-300 border-emerald-500/30' : 'bg-emerald-100 text-emerald-800 border-emerald-300'}`}>
              Section 4: Student-Defined Thematic Clustering
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Input Custom Themes & Assign Tagged Statements</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-emerald-200/80' : 'text-emerald-900/80'}`}>
              Create your synthesis matrix headings. Check off tagged annotations to group statements under your themes.
            </p>
          </div>

          <form onSubmit={handleAddTheme} class={`p-4 rounded-2xl border flex gap-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
            <input
              type="text"
              placeholder="Input custom theme heading (e.g., 'Digital Infrastructure Gaps in Local Higher Education')..."
              value={newThemeInput}
              onChange={(e) => setNewThemeInput(e.target.value)}
              class={`flex-1 rounded-xl px-4 py-2.5 text-xs border focus:outline-none focus:border-emerald-500 ${isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
            />
            <button
              type="submit"
              class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow transition-all shrink-0"
            >
              + Add Theme
            </button>
          </form>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {userThemes.map((theme) => {
              const assignedAnnIds = themeAssignments[theme.id] || [];
              return (
                <div key={theme.id} class={`p-5 rounded-2xl border space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                  <div class="flex items-center justify-between gap-2 border-b border-slate-700/50 pb-3">
                    <h3 class="font-bold text-sm text-emerald-500 flex items-center gap-2">
                      <span>{theme.title}</span>
                      <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-500 rounded-full text-[10px] border border-emerald-500/30 font-mono">
                        {assignedAnnIds.length} items
                      </span>
                    </h3>
                    <button
                      onClick={() => handleDeleteTheme(theme.id)}
                      class="text-xs text-slate-400 hover:text-rose-500 transition-colors"
                    >
                      Remove
                    </button>
                  </div>

                  <div class="space-y-2 max-h-80 overflow-y-auto custom-scrollbar pr-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">
                      Assign Tagged Statements to Theme:
                    </span>
                    {allAnnotations.length === 0 ? (
                      <p class="text-[11px] text-slate-400 py-2">Add annotations in Section 3 first.</p>
                    ) : (
                      allAnnotations.map((ann) => {
                        const isAssigned = assignedAnnIds.includes(ann.id);
                        return (
                          <label
                            key={ann.id}
                            class={`p-2.5 rounded-xl border flex items-start gap-3 cursor-pointer transition-all ${
                              isAssigned
                                ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-700 dark:text-emerald-300'
                                : isDarkMode ? 'bg-slate-950/60 border-slate-800 text-slate-400' : 'bg-slate-50 border-slate-200 text-slate-600'
                            }`}
                          >
                            <input
                              type="checkbox"
                              checked={isAssigned}
                              onChange={() => toggleAnnotationInTheme(theme.id, ann.id)}
                              class="mt-1 rounded border-slate-700 text-emerald-600 focus:ring-emerald-500"
                            />
                            <div class="space-y-0.5 text-xs">
                              <p class="font-medium">{ann.text}</p>
                              <div class="text-[10px] text-slate-400 flex items-center gap-2">
                                <span>{ann.studyTitle}</span>
                                <span>&bull;</span>
                                <span class="capitalize">{ann.type.replace('_', ' ')}</span>
                              </div>
                            </div>
                          </label>
                        );
                      })
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. SYNTHESIS, AI COACH & SUBMISSION
    // ==========================================
    function SynthesisSection({
      studies,
      userThemes,
      themeAssignments,
      synthesisTitle,
      setSynthesisTitle,
      synthesisText,
      setSynthesisText,
      apiKey,
      rubricScores,
      setRubricScores,
      submissionStatus,
      setSubmissionStatus,
      teacherFeedback,
      isDarkMode
    }) {
      const [aiFeedback, setAiFeedback] = useState([]);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const criteriaDescriptors = {
        thematicIntegration: {
          title: "1. Thematic Integration & Evidence Alignment",
          levels: {
            1: "Level 1 (Emerging): Themes are unstructured or missing explicit connections to uploaded research evidence.",
            2: "Level 2 (Developing): Identifies overarching themes but relies on isolated paper summaries rather than integrated evidence.",
            3: "Level 3 (Proficient): Integrates tagged evidence clearly across active custom themes with minor synthesis gaps.",
            4: "Level 4 (Exemplary): Flawlessly synthesizes evidence across local and foreign literature under distinct thematic clusters."
          }
        },
        criticalSynthesis: {
          title: "2. Critical Synthesis & Literature Comparison",
          levels: {
            1: "Level 1 (Emerging): Merely lists study abstracts without comparing methodologies or localized contexts.",
            2: "Level 2 (Developing): Highlights similarities between studies but lacks critical critique of methodology gaps or limitations.",
            3: "Level 3 (Proficient): Evaluates research methodologies, comparing local Philippine findings against international literature.",
            4: "Level 4 (Exemplary): Deeply synthesizes theoretical frameworks, contrasting local and foreign empirical evidence to identify literature gaps."
          }
        },
        academicTone: {
          title: "3. Academic Tone, Grammar & Sentence Flow",
          levels: {
            1: "Level 1 (Emerging): Uses informal language, first-person narrative, or exhibits frequent grammatical errors.",
            2: "Level 2 (Developing): Displays acceptable grammar but struggles with transitional flow and passive/active voice consistency.",
            3: "Level 3 (Proficient): Demonstrates formal academic tone with clear sentence transitions and minimal grammatical errors.",
            4: "Level 4 (Exemplary): Impeccable scholarly vocabulary, polished transition flow, and rigorous academic prose."
          }
        },
        citationAccuracy: {
          title: "4. Citation Accuracy & In-Text Attribution",
          levels: {
            1: "Level 1 (Emerging): Missing in-text parenthetical citations or violates basic academic attribution rules.",
            2: "Level 2 (Developing): Includes parenthetical citations, but exhibits formatting errors in author lists or publication dates.",
            3: "Level 3 (Proficient): Accurately applies in-text attribution guidelines with minor punctuation errors.",
            4: "Level 4 (Exemplary): Flawlessly formats all in-text parenthetical citations and attribution statements."
          }
        }
      };

      const handleRunAiCoach = async () => {
        if (!synthesisText.trim()) return;
        setIsAnalyzing(true);

        if (apiKey && apiKey.trim().length > 10) {
          try {
            const prompt = `Act as an academic research coach. Evaluate this student literature synthesis against active themes.
Provide feedback on:
1. Grammar & Punctuation
2. Structural Flow & Thematic Synthesis
3. In-Text Citation Accuracy

Synthesis Draft:
"${synthesisText}"

Return JSON array: [{"type": "grammar"|"structure"|"citation", "suggestion": "description"}]`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const raw = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const match = raw?.match(/\[[\s\S]*\]/);
            if (match) {
              setAiFeedback(JSON.parse(match[0]));
              setIsAnalyzing(false);
              return;
            }
          } catch (err) {
            console.warn('Gemini error, falling back:', err);
          }
        }

        setTimeout(() => {
          const feedback = [];
          if (synthesisText.length < 150) {
            feedback.push({
              type: 'structure',
              suggestion: 'Your draft is brief. Expand paragraph comparisons between local and international findings.'
            });
          }
          if (!synthesisText.includes('(') || !synthesisText.includes(')')) {
            feedback.push({
              type: 'citation',
              suggestion: 'In-text citations are missing. Include parenthetical author attributions (e.g., Santos & Cruz, 2024).'
            });
          } else {
            feedback.push({
              type: 'citation',
              suggestion: 'In-text parenthetical citations detected. Ensure author surnames match the source list.'
            });
          }

          feedback.push({
            type: 'grammar',
            suggestion: 'Maintain objective academic tone and avoid first-person pronouns where possible.'
          });

          setAiFeedback(feedback);
          setIsAnalyzing(false);
        }, 800);
      };

      const getAssignedAnnotationsForTheme = (themeId) => {
        const annIds = themeAssignments[themeId] || [];
        const result = [];
        studies.forEach(s => {
          s.annotations.forEach(ann => {
            if (annIds.includes(ann.id)) {
              result.push({ ...ann, studyTitle: s.title, studyOrigin: s.origin });
            }
          });
        });
        return result;
      };

      return (
        <div class="space-y-6 print-container">
          <div class={`p-5 rounded-2xl border no-print ${isDarkMode ? 'bg-indigo-950/40 border-indigo-800/60' : 'bg-indigo-50 border-indigo-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-indigo-600/30 text-indigo-300 border-indigo-500/30' : 'bg-indigo-100 text-indigo-800 border-indigo-300'}`}>
              Section 5: Synthesis Drafting, AI Coach & Submission
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Write Synthesis, Self-Evaluate & Submit for Teacher Feedback</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-indigo-200/80' : 'text-indigo-900/80'}`}>
              Draft your synthesis narrative, review rubric criteria levels, run AI coaching scans, and submit your work directly to your teacher.
            </p>
          </div>

          <div class="hidden print:block mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-black">{synthesisTitle || 'Academic Literature Review Synthesis'}</h1>
            <p class="text-xs text-slate-600 mt-1">
              Generated via SynthesizeAI Platform &bull; Self-Evaluation Score: {Object.values(rubricScores).reduce((a, b) => a + b, 0)}/16
            </p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 space-y-4">
              <div class={`p-4 rounded-2xl border space-y-3 print-card ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h3 class="text-xs font-bold text-indigo-500 uppercase tracking-wider print-text">
                  Active Clustered Themes Matrix ({userThemes.length})
                </h3>

                <div class="space-y-3 max-h-[600px] overflow-y-auto custom-scrollbar pr-1">
                  {userThemes.map((theme) => {
                    const taggedItems = getAssignedAnnotationsForTheme(theme.id);
                    return (
                      <div key={theme.id} class={`p-3.5 rounded-xl border space-y-2 print-card ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                        <h4 class="font-bold text-xs text-emerald-500 print-text">{theme.title}</h4>
                        
                        <div class="space-y-1.5 pt-1">
                          {taggedItems.length === 0 ? (
                            <p class="text-[10px] text-slate-400 italic">No tagged statements assigned to this theme.</p>
                          ) : (
                            taggedItems.map((item) => (
                              <div key={item.id} class={`p-2 rounded-lg border text-[11px] space-y-1 print-card ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                <p class={`print-text ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>"{item.text}"</p>
                                <div class="flex items-center justify-between text-[9px] text-slate-400">
                                  <span>{item.studyTitle}</span>
                                  <span class="text-amber-500">Pg. {item.page}</span>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div class="lg:col-span-7 space-y-5">
              <div class={`p-5 rounded-2xl border space-y-4 print-card ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <input
                  type="text"
                  placeholder="Synthesis Title..."
                  value={synthesisTitle}
                  onChange={(e) => setSynthesisTitle(e.target.value)}
                  class={`w-full rounded-xl px-4 py-2.5 text-sm font-bold border focus:outline-none focus:border-indigo-500 print-text ${
                    isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                  }`}
                />

                <textarea
                  rows="10"
                  placeholder="Draft your synthesis narrative here... Synthesize findings across local and foreign literature using your active clusters..."
                  value={synthesisText}
                  onChange={(e) => setSynthesisText(e.target.value)}
                  class={`w-full rounded-xl p-4 text-xs border focus:outline-none focus:border-indigo-500 leading-relaxed font-sans print-text ${
                    isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-300 text-slate-800'
                  }`}
                ></textarea>

                <div class="flex flex-wrap items-center justify-between gap-2 no-print">
                  <div class="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={handleRunAiCoach}
                      disabled={isAnalyzing}
