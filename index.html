                    );
                  })}
                </div>
              </div>
            </div>

            <div class="lg:col-span-7 space-y-5">
              <div class={`p-5 rounded-2xl border space-y-4 print-card ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <input
                  type="text"
                  placeholder="Synthesis Title..."
                  value={synthesisTitle}
                  onChange={(e) => setSynthesisTitle(e.target.value)}
                  class={`w-full rounded-xl px-4 py-2.5 text-sm font-bold border focus:outline-none focus:border-indigo-500 print-text ${
                    isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                  }`}
                />

                <textarea
                  rows="10"
                  placeholder="Draft your synthesis narrative here... Synthesize findings across local and foreign literature using your active clusters..."
                  value={synthesisText}
                  onChange={(e) => setSynthesisText(e.target.value)}
                  class={`w-full rounded-xl p-4 text-xs border focus:outline-none focus:border-indigo-500 leading-relaxed font-sans print-text ${
                    isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-300 text-slate-800'
                  }`}
                ></textarea>

                <div class="flex flex-wrap items-center justify-between gap-2 no-print">
                  <div class="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={handleRunAiCoach}
                      disabled={isAnalyzing}
                      class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
                    >
                      {isAnalyzing ? 'Scanning Draft...' : 'Run AI Writing Coach'}
                    </button>

                    <button
                      type="button"
                      onClick={() => setSubmissionStatus('submitted')}
                      class={`px-4 py-2 font-semibold text-xs rounded-xl shadow transition-all ${
                        submissionStatus === 'submitted'
                          ? 'bg-amber-600 text-white'
                          : 'bg-purple-600 hover:bg-purple-500 text-white'
                      }`}
                    >
                      {submissionStatus === 'submitted' ? 'Submitted to Teacher' : 'Submit to Teacher'}
                    </button>
                  </div>

                  <button
                    type="button"
                    onClick={() => window.print()}
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow transition-all flex items-center gap-2"
                  >
                    <span>Printable PDF</span>
                    <span>&darr;</span>
                  </button>
                </div>
              </div>

              {/* Teacher Reviewed Feedback Display */}
              {teacherFeedback.comments && (
                <div class={`p-5 rounded-2xl border space-y-2 no-print ${isDarkMode ? 'bg-purple-950/40 border-purple-800' : 'bg-purple-50 border-purple-200'}`}>
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-purple-500 uppercase tracking-wider">Teacher Review & Feedback</span>
                    <span class="text-xs font-mono font-bold text-purple-400">Grade: {teacherFeedback.grade || 'A'}</span>
                  </div>
                  <p class={`text-xs leading-relaxed ${isDarkMode ? 'text-purple-200' : 'text-purple-900'}`}>"{teacherFeedback.comments}"</p>
                </div>
              )}

              {aiFeedback.length > 0 && (
                <div class={`p-5 rounded-2xl border space-y-3 no-print ${isDarkMode ? 'bg-indigo-950/50 border-indigo-800' : 'bg-indigo-50 border-indigo-200'}`}>
                  <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>AI Writing Coach Feedback</h4>
                  <div class="space-y-2">
                    {aiFeedback.map((fb, idx) => (
                      <div key={idx} class={`p-3 rounded-xl border text-xs space-y-1 ${isDarkMode ? 'bg-slate-900/90 border-indigo-900/80 text-indigo-200' : 'bg-white border-indigo-200 text-indigo-900'}`}>
                        <span class="px-2 py-0.5 rounded text-[9px] font-bold uppercase bg-indigo-600 text-white">
                          {fb.type}
                        </span>
                        <p>{fb.suggestion}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Student Self-Evaluation Rubric */}
              <div class={`p-5 rounded-2xl border space-y-4 print-card ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h4 class={`font-bold text-xs uppercase tracking-wider print-text ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                  Detailed Student Self-Evaluation Rubric
                </h4>

                <div class="space-y-4 text-xs">
                  {Object.entries(criteriaDescriptors).map(([key, item]) => {
                    const currentScore = rubricScores[key];
                    return (
                      <div key={key} class={`p-4 rounded-xl border space-y-2 print-card ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                        <div class="flex justify-between items-center">
                          <span class={`font-semibold print-text ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}>{item.title}</span>
                          <span class="text-indigo-500 font-mono font-bold">{currentScore}/4</span>
                        </div>

                        <p class={`text-[11px] p-2 rounded border leading-relaxed print-text ${
                          isDarkMode ? 'bg-indigo-950/50 border-indigo-900/60 text-indigo-200' : 'bg-indigo-50 border-indigo-200 text-indigo-900'
                        }`}>
                          {item.levels[currentScore]}
                        </p>

                        <div class="flex gap-2 pt-1 no-print">
                          {[1, 2, 3, 4].map(score => (
                            <button
                              key={score}
                              onClick={() => setRubricScores({ ...rubricScores, [key]: score })}
                              class={`flex-1 py-1 rounded text-[11px] font-bold border transition-all ${
                                currentScore === score
                                  ? 'bg-indigo-600 text-white border-indigo-500'
                                  : isDarkMode ? 'bg-slate-900 text-slate-400 border-slate-800' : 'bg-white text-slate-600 border-slate-300'
                              }`}
                            >
                              Level {score}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div class={`p-3 rounded-xl border flex items-center justify-between text-xs print-card ${
                  isDarkMode ? 'bg-emerald-950/60 border-emerald-800/80 text-emerald-300' : 'bg-emerald-50 border-emerald-200 text-emerald-800'
                }`}>
                  <span class="print-text">Self-Evaluation Total Score:</span>
                  <span class="font-bold text-sm font-mono print-text">
                    {Object.values(rubricScores).reduce((a, b) => a + b, 0)} / 16 Points
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. TEACHER FEEDBACK PORTAL
    // ==========================================
    function TeacherFeedbackPortal({
      studies,
      userThemes,
      themeAssignments,
      synthesisTitle,
      synthesisText,
      rubricScores,
      submissionStatus,
      setSubmissionStatus,
      teacherFeedback,
      setTeacherFeedback,
      userName,
      isDarkMode
    }) {
      const [diagnosticFlags, setDiagnosticFlags] = useState([]);
      const [teacherGradeInput, setTeacherGradeInput] = useState(teacherFeedback.grade || 'A');
      const [teacherCommentInput, setTeacherCommentInput] = useState(teacherFeedback.comments || '');

      // Sentence-Level Diagnostic Flagging Engine
      const handleRunDiagnosticScan = () => {
        if (!synthesisText.trim()) return;

        const sentences = synthesisText.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 10);
        const flags = [];

        sentences.forEach((sentence, idx) => {
          if (!sentence.includes('(') && !sentence.includes(')')) {
            flags.push({
              id: 'flag-' + idx,
              sentence,
              type: 'Missing Citation',
              severity: 'warning',
              suggestion: 'Add in-text parenthetical author attribution for empirical claims.'
            });
          }
          if (/\b(I|me|my|we|us|our)\b/i.test(sentence)) {
            flags.push({
              id: 'flag-tone-' + idx,
              sentence,
              type: 'Informal Tone',
              severity: 'critical',
              suggestion: 'Avoid first-person pronouns. Maintain objective scholarly voice.'
            });
          }
        });

        setDiagnosticFlags(flags);
      };

      const handleSaveTeacherFeedback = (e) => {
        e.preventDefault();
        setTeacherFeedback({
          grade: teacherGradeInput,
          comments: teacherCommentInput,
          reviewedAt: Date.now()
        });
        setSubmissionStatus('reviewed');
      };

      return (
        <div class="space-y-6">
          <div class={`p-5 rounded-2xl border ${isDarkMode ? 'bg-purple-950/40 border-purple-800/60' : 'bg-purple-50 border-purple-200'}`}>
            <span class={`px-2.5 py-1 border rounded-full text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'bg-purple-600/30 text-purple-300 border-purple-500/30' : 'bg-purple-100 text-purple-800 border-purple-300'}`}>
              Section 6: Teacher Evaluation & Live Diagnostic Feedback Portal
            </span>
            <h2 class={`text-xl font-bold mt-1 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Instructor Assessment & Sentence Diagnostic Flagging</h2>
            <p class={`text-xs mt-0.5 ${isDarkMode ? 'text-purple-200/80' : 'text-purple-900/80'}`}>
              Review submitted student literature syntheses, inspect sentence-level diagnostic flags, and assign feedback grades.
            </p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Student Submission Summary & Diagnostic Controls */}
            <div class="lg:col-span-7 space-y-5">
              <div class={`p-5 rounded-2xl border space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <div class="flex items-center justify-between border-b pb-3 border-slate-700/50">
                  <div>
                    <h3 class={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{synthesisTitle || 'Untitled Synthesis'}</h3>
                    <p class="text-xs text-slate-400">Student: {userName} &bull; Status: <strong class="text-purple-400 capitalize">{submissionStatus}</strong></p>
                  </div>
                  <button
                    onClick={handleRunDiagnosticScan}
                    class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
                  >
                    Run Sentence Diagnostics
                  </button>
                </div>

                <div class={`p-4 rounded-xl border text-xs leading-relaxed max-h-80 overflow-y-auto ${
                  isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'
                }`}>
                  {synthesisText || 'No synthesis narrative submitted yet.'}
                </div>
              </div>

              {/* Diagnostic Flags List */}
              {diagnosticFlags.length > 0 && (
                <div class={`p-5 rounded-2xl border space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                  <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                    Sentence-Level Diagnostic Flags ({diagnosticFlags.length})
                  </h4>

                  <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                    {diagnosticFlags.map((flag) => (
                      <div key={flag.id} class={`p-3 rounded-xl border text-xs space-y-1 ${
                        flag.severity === 'critical'
                          ? isDarkMode ? 'bg-rose-950/50 border-rose-800 text-rose-200' : 'bg-rose-50 border-rose-200 text-rose-900'
                          : isDarkMode ? 'bg-amber-950/50 border-amber-800 text-amber-200' : 'bg-amber-50 border-amber-200 text-amber-900'
                      }`}>
                        <div class="flex justify-between items-center font-bold">
                          <span>Flag: {flag.type}</span>
                          <span class="text-[9px] uppercase px-2 py-0.5 rounded bg-slate-800 text-white">{flag.severity}</span>
                        </div>
                        <p class="italic">"{flag.sentence}"</p>
                        <p class="text-[11px] font-semibold">&rarr; {flag.suggestion}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* Teacher Feedback Entry Form */}
            <div class="lg:col-span-5 space-y-5">
              <form onSubmit={handleSaveTeacherFeedback} class={`p-5 rounded-2xl border space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h4 class={`font-bold text-xs uppercase tracking-wider ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                  Teacher Evaluation Form
                </h4>

                <div class="space-y-2 text-xs">
                  <label class="block text-slate-400 font-medium">Assigned Grade / Performance Level:</label>
                  <select
                    value={teacherGradeInput}
                    onChange={(e) => setTeacherGradeInput(e.target.value)}
                    class={`w-full rounded-xl p-2.5 text-xs border focus:outline-none focus:border-purple-500 ${
                      isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'
                    }`}
                  >
                    <option value="A (Exemplary)">A (Exemplary 15-16 pts)</option>
                    <option value="B (Proficient)">B (Proficient 12-14 pts)</option>
                    <option value="C (Developing)">C (Developing 9-11 pts)</option>
                    <option value="D (Needs Revision)">D (Needs Revision &lt;9 pts)</option>
                  </select>
                </div>

                <div class="space-y-2 text-xs">
                  <label class="block text-slate-400 font-medium">Detailed Instructor Commentary:</label>
                  <textarea
                    rows="6"
                    placeholder="Provide specific feedback on thematic integration, citation accuracy, and empirical synthesis..."
                    value={teacherCommentInput}
                    onChange={(e) => setTeacherCommentInput(e.target.value)}
                    class={`w-full rounded-xl p-3 text-xs border focus:outline-none focus:border-purple-500 ${
                      isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'
                    }`}
                  ></textarea>
                </div>

                <button
                  type="submit"
                  class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs rounded-xl shadow transition-all"
                >
                  Save & Publish Feedback to Student
                </button>
              </form>

              {/* Student Self-Evaluation Score Matrix Reference */}
              <div class={`p-4 rounded-2xl border text-xs space-y-2 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <span class="font-bold text-slate-400 uppercase tracking-wider block">Student Self-Evaluation Matrix:</span>
                <div class="grid grid-cols-2 gap-2 font-mono">
                  <div class={`p-2 rounded border ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                    Integration: {rubricScores.thematicIntegration}/4
                  </div>
                  <div class={`p-2 rounded border ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                    Synthesis: {rubricScores.criticalSynthesis}/4
                  </div>
                  <div class={`p-2 rounded border ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                    Tone/Style: {rubricScores.academicTone}/4
                  </div>
                  <div class={`p-2 rounded border ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                    Citations: {rubricScores.citationAccuracy}/4
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
