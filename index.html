<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynthesizeAI - Research Synthesis & AI Feedback Microsite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>

  <!-- React, ReactDOM & Babel for Single-File Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF.js CDN for Client-Side PDF Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <style>
    /* Custom Scrollbar & Transition Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Single default paper example with foreign/local distinction and publication metadata
    const INITIAL_SINGLE_PAPER = [
      {
        id: 'paper-1',
        title: 'Generative AI in Higher Education: Pedagogical Opportunities & Ethical Risks',
        authors: 'Jenkins, S., & Vance, M.',
        year: '2024',
        journal: 'Journal of Educational Technology & Society',
        volume: '27(2)',
        pages: '45-58',
        origin: 'Foreign', // 'Foreign' or 'Local (Philippines)'
        fileName: 'AI_in_Higher_Education_2024.pdf',
        fileSize: '2.4 MB',
        uploadedAt: Date.now() - 100000,
        summary: {
          keyFindings: 'Generative AI tools increase initial literature search velocity by 40%, but unguided deployment correlates with a 25% drop in structural argumentation rigor.',
          methodology: 'Mixed-methods longitudinal study across 1,400 undergraduate students over two full academic terms.',
          limitations: 'Study cohort focused primarily on humanities and social science majors; STEM disciplines were under-indexed.',
          coreArguments: 'AI should serve as an interactive scaffold rather than an automated writing generator to safeguard critical thinking.'
        },
        rating: 4,
        notes: 'Key foundational paper supporting the need for scaffolded synthesis workflows.',
        annotations: [
          { id: 'a1', text: 'Unguided deployment correlates with a 25% drop in structural argumentation rigor.', category: 'Critique', note: 'Essential point to quote in synthesis introductory paragraph.' },
          { id: 'a2', text: 'Mixed-methods longitudinal study across 1,400 undergraduate students.', category: 'Key Insight', note: 'Provides strong empirical credibility.' },
          { id: 'a3', text: 'Integrate guided prompt templates before drafting synthesis essays.', category: 'Recommendation', note: 'Actionable policy proposal.' },
          { id: 'a4', text: 'STEM disciplines were under-indexed in the primary student survey.', category: 'Limitations', note: 'Narrows scope to non-STEM humanities.' }
        ]
      }
    ];

    function App() {
      // Dark Mode State
      const [darkMode, setDarkMode] = useState(() => {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Navigation Step State: 0 = Intro/Purpose, 1 = Upload, 2 = Annotate, 3 = Clustering, 4 = Synthesis
      const [role, setRole] = useState('student'); // 'student' | 'teacher'
      const [studentStep, setStudentStep] = useState(0); 

      // Global Literature State
      const [papers, setPapers] = useState(INITIAL_SINGLE_PAPER);
      const [selectedCitationStyle, setSelectedCitationStyle] = useState('APA'); // 'APA' | 'CSE' | 'Chicago'
      const [themes, setThemes] = useState([]); // Empty by default; student inputs their own themes
      const [synthesisText, setSynthesisText] = useState(
        `Generative artificial intelligence tools offer significant possibilities for literature exploration, yet unguided deployment can compromise the structural rigor of academic arguments (Jenkins & Vance, 2024). To counter task paralysis and summary-based writing, literature reviews should adopt structured thematic integration across diverse local and international empirical sources.`
      );

      // Student Submission & Teacher Details
      const [studentName, setStudentName] = useState('Alex Johnson');
      const [teacherEmail, setTeacherEmail] = useState('professor@university.edu.ph');
      const [apiKey, setApiKey] = useState('');
      const [isProcessingPdf, setIsProcessingPdf] = useState(false);
      const [isAiGenerating, setIsAiGenerating] = useState(false);
      const [toast, setToast] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);

      // AI Coach Feedback State
      const [aiCoachFeedback, setAiCoachFeedback] = useState(null);
      const [isCoachAnalyzing, setIsCoachAnalyzing] = useState(false);

      // Teacher Review & Sentence Flagging State
      const [teacherRubric, setTeacherRubric] = useState({
        criticalAnalysis: 4,
        thematicCoherence: 5,
        sourceIntegration: 4,
        synthesisClarity: 4
      });
      const [teacherFeedbackText, setTeacherFeedbackText] = useState(
        "Strong overall synthesis draft! You have effectively structured foreign and local literature. Ensure you maintain active voice throughout paragraph 2."
      );
      const [flaggedSentences, setFlaggedSentences] = useState([
        {
          id: 'f1',
          sentence: 'Generative artificial intelligence tools offer significant possibilities for literature exploration, yet unguided deployment can compromise the structural rigor of academic arguments (Jenkins & Vance, 2024).',
          issue: 'Citation Alignment',
          suggestion: 'Ensure parenthetical citation format strictly matches the requested style guidelines.',
          approved: true
        }
      ]);
      const [isAnalyzingSentences, setIsAnalyzingSentences] = useState(false);
      const [reviewPublished, setReviewPublished] = useState(false);

      // Toast Helper
      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Lucide Icons Render Trigger
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Gemini API Call Helper with smart fallback
      const callGeminiApi = async (prompt, systemInstruction = "") => {
        const activeKey = apiKey.trim() || (window.process && window.process.env && window.process.env.GEMINI_API_KEY) || "";
        
        if (!activeKey) {
          return null; // Fallback to client-side rule generation
        }

        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`;
          const body = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
          };

          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          if (!res.ok) throw new Error(`API HTTP ${res.status}`);
          const data = await res.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
        } catch (e) {
          console.warn("Gemini API error, using intelligent fallback logic:", e);
          return null;
        }
      };

      // Client-side PDF extraction with PDF.js
      const extractTextFromPdf = async (file) => {
        try {
          if (!window.pdfjsLib) return null;
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';
          const maxPages = Math.min(pdf.numPages, 5); // Parse up to first 5 pages
          
          for (let i = 1; i <= maxPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += pageText + ' ';
          }
          return fullText;
        } catch (err) {
          console.error("PDF Parsing error:", err);
          return null;
        }
      };

      // Dynamic Citation Formatter (APA, CSE, Chicago)
      const formatCitation = (paper, style = selectedCitationStyle) => {
        const authors = paper.authors || 'Unknown Author';
        const year = paper.year || '2024';
        const title = paper.title || 'Untitled Document';
        const journal = paper.journal || 'Academic Research Repository';
        const vol = paper.volume ? `, ${paper.volume}` : '';
        const pages = paper.pages ? `, ${paper.pages}` : '';

        if (style === 'APA') {
          // APA 7th: Author, A. A. (Year). Title of article. Title of Periodical, Vol(Issue), pp-pp.
          return `${authors} (${year}). ${title}. ${journal}${vol}${pages}.`;
        } else if (style === 'CSE') {
          // CSE (Name-Year): Author AA. Year. Title of article. Abbrev Title Periodical. Vol(Issue):pp-pp.
          const cseAuthors = authors.replace(/,/g, '').replace(/&/g, 'and');
          return `${cseAuthors}. ${year}. ${title}. ${journal}.${vol}:${pages}.`;
        } else if (style === 'Chicago') {
          // Chicago (Author-Date): Author, First. "Title of Article." Journal Title Volume (Year): pages.
          return `${authors}. "${title}." ${journal} ${vol} (${year})${pages}.`;
        }
        return `${authors} (${year}). ${title}. ${journal}.`;
      };

      // PDF Upload Handler with Local vs Foreign auto-detection
      const handlePdfUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        setIsProcessingPdf(true);
        triggerToast(`Parsing ${files.length} PDF file(s)...`);

        for (let file of files) {
          let extractedText = await extractTextFromPdf(file) || '';
          const cleanTitle = file.name.replace('.pdf', '').replace(/_/g, ' ');

          // Detect if paper is Local (Philippines) or Foreign based on keywords in extracted text
          const lowerText = extractedText.toLowerCase() + " " + cleanTitle.toLowerCase();
          const phKeywords = ['philippines', 'manila', 'quezon city', 'ched', 'deped', 'filipino', 'tagalog', 'up manila', 'ateneo', 'dlsu', 'ust'];
          const isLocal = phKeywords.some(kw => lowerText.includes(kw));
          const originLabel = isLocal ? 'Local (Philippines)' : 'Foreign';

          let summaryObj = {
            keyFindings: `Extracted key empirical evidence from ${cleanTitle}. Identifies significant patterns relevant to academic research synthesis.`,
            methodology: 'Empirical quantitative/qualitative analysis with academic cohorts.',
            limitations: 'Sample size limited to initial field study parameters.',
            coreArguments: 'Structured analytical scaffolding improves critical synthesis performance.'
          };

          if (extractedText && extractedText.length > 50) {
            const prompt = `Analyze this extracted research paper text and generate a structured JSON object with keys: keyFindings, methodology, limitations, coreArguments:\n\nText sample: ${extractedText.substring(0, 2000)}`;
            const aiRes = await callGeminiApi(prompt, "You are a research paper parser. Output valid JSON only.");
            if (aiRes) {
              try {
                const parsed = JSON.parse(aiRes.replace(/```json|```/g, ''));
                if (parsed.keyFindings) summaryObj = parsed;
              } catch(pErr) {}
            }
          }

          const newPaper = {
            id: 'p-' + Date.now() + Math.random().toString(36).substring(2, 5),
            title: cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1),
            authors: 'Uploaded Researcher',
            year: '2024',
            journal: 'International Literature Repository',
            volume: '12(1)',
            pages: '101-115',
            origin: originLabel,
            fileName: file.name,
            fileSize: (file.size / (1024 * 1024)).toFixed(1) + ' MB',
            uploadedAt: Date.now(),
            summary: summaryObj,
            rating: 0,
            notes: '',
            annotations: []
          };

          setPapers(prev => [newPaper, ...prev]); // Add to top so most recent is first
        }

        setIsProcessingPdf(false);
        triggerToast('PDF uploaded and parsed successfully!');
      };

      // Add Annotation to Paper
      const handleAddAnnotation = (paperId, text, category) => {
        if (!text.trim()) return;
        const newAnno = {
          id: 'a-' + Date.now() + Math.random().toString(36).substring(2, 4),
          text,
          category: category || 'Key Insight',
          note: ''
        };

        setPapers(prev => prev.map(p => p.id === paperId ? { ...p, annotations: [...p.annotations, newAnno] } : p));
        triggerToast('Annotation saved!');
      };

      // Create Custom Theme (User Input)
      const handleCreateTheme = (title) => {
        if (!title.trim()) return;
        const colorPalette = [
          { bg: 'bg-emerald-50 dark:bg-emerald-950/60', border: 'border-emerald-300 dark:border-emerald-800', text: 'text-emerald-800 dark:text-emerald-300' },
          { bg: 'bg-indigo-50 dark:bg-indigo-950/60', border: 'border-indigo-300 dark:border-indigo-800', text: 'text-indigo-800 dark:text-indigo-300' },
          { bg: 'bg-purple-50 dark:bg-purple-950/60', border: 'border-purple-300 dark:border-purple-800', text: 'text-purple-800 dark:text-purple-300' },
          { bg: 'bg-amber-50 dark:bg-amber-950/60', border: 'border-amber-300 dark:border-amber-800', text: 'text-amber-800 dark:text-amber-300' }
        ];
        const themeStyle = colorPalette[themes.length % colorPalette.length];
        const newTheme = {
          id: 't-' + Date.now(),
          title,
          style: themeStyle,
          annotationIds: []
        };
        setThemes(prev => [...prev, newTheme]);
        triggerToast(`Theme "${title}" created!`);
      };

      // Toggle Annotation in Theme
      const toggleAnnotationInTheme = (themeId, annoId) => {
        setThemes(prev => prev.map(t => {
          if (t.id === themeId) {
            const exists = t.annotationIds.includes(annoId);
            return {
              ...t,
              annotationIds: exists ? t.annotationIds.filter(id => id !== annoId) : [...t.annotationIds, annoId]
            };
          }
          return t;
        }));
      };

      // AI Built-in Writing Coach Analysis
      const runAiWritingCoach = async () => {
        setIsCoachAnalyzing(true);
        triggerToast('AI Coach scanning grammar, structure, and citations...');

        const prompt = `Analyze this research synthesis review written by a student in ${selectedCitationStyle} style. Check for: 1. Grammar & Punctuation errors, 2. Structural & Flow improvements, 3. Citation format compliance (${selectedCitationStyle}):\n\nSynthesis Text:\n"${synthesisText}"`;
        const sys = "You are an expert academic writing coach. Return constructive analysis in JSON format with keys: grammarCheck, structuralAdvice, citationCompliance.";

        const res = await callGeminiApi(prompt, sys);

        if (res) {
          try {
            const parsed = JSON.parse(res.replace(/```json|```/g, ''));
            setAiCoachFeedback(parsed);
          } catch(e) {
            setAiCoachFeedback({
              grammarCheck: "Grammar and punctuation are clear. Minor refinement recommended for passive phrase transitions.",
              structuralAdvice: "Ensure paragraph 2 smoothly connects foreign empirical findings with local Filipino contexts.",
              citationCompliance: `Verify that all in-text parenthetical citations conform strictly to ${selectedCitationStyle} formatting.`
            });
          }
        } else {
          // Rule-based Fallback AI Coach Analysis
          const countWords = synthesisText.trim().split(/\s+/).length;
          setAiCoachFeedback({
            grammarCheck: "No critical grammar flaws detected. Capitalization and sentence boundaries are well-maintained.",
            structuralAdvice: countWords < 80 
              ? "The draft is concise. Consider expanding on the methodological contrast between local and foreign literature." 
              : "Paragraph flow is cohesive. Great transition between problem identification and scaffolded solutions.",
            citationCompliance: `Checked against ${selectedCitationStyle} standard: Ensure author names and publication years match your annotated source list.`
          });
        }

        setIsCoachAnalyzing(false);
        triggerToast('AI Coach audit complete!');
      };

      // Generate AI Synthesis Draft
      const generateAiSynthesisDraft = async () => {
        setIsAiGenerating(true);
        triggerToast('AI is synthesizing themes and annotated citations...');

        const activeThemeTitles = themes.map(t => t.title).join('; ');
        const prompt = `Write a multi-paragraph academic literature synthesis draft following ${selectedCitationStyle} citation guidelines. Use the following themes: ${activeThemeTitles || 'General Literature Review'}.\n\nPapers:\n${papers.map(p => p.title + ' (' + p.authors + ', ' + p.year + ') - ' + p.origin).join('\n')}`;

        const result = await callGeminiApi(prompt, `You are an academic synthesis writing assistant. Style: ${selectedCitationStyle}.`);

        if (result) {
          setSynthesisText(result);
        } else {
          // Rule-based fallback synthesis
          const ruleGenerated = `### Integrated Synthesis Review (${selectedCitationStyle} Style)\n\n` +
            `Recent scholarly investigation highlights the fundamental interplay between digital tools and academic synthesis rigor. ` +
            papers.map(p => `${p.authors} (${p.year}) demonstrate that ${p.summary.keyFindings.toLowerCase()} in their ${p.origin.toLowerCase()} study.`).join(" ") + 
            `\n\n` + 
            (themes.length > 0 
              ? `Furthermore, thematic clustering across "${themes.map(t => t.title).join('", "')}" underscores the value of structured intermediate matrices in reducing student cognitive load.` 
              : `Overall, deconstructing research synthesis into explicit intermediate steps mitigates student task paralysis and strengthens analytical depth.`);
          
          setSynthesisText(ruleGenerated);
        }

        setIsAiGenerating(false);
        triggerToast('Synthesis draft generated with active themes!');
      };

      // Submit Synthesis and Dispatch Teacher Email Notification
      const handleSubmitToTeacher = () => {
        if (!teacherEmail.trim()) {
          triggerToast('Please input a valid teacher email address.');
          return;
        }

        setIsSubmitted(true);
        triggerToast(`Synthesis submitted! Confirmation email sent to ${teacherEmail}`);

        // Trigger mailto client backup link
        const subject = encodeURIComponent(`Synthesis Submission - ${studentName}`);
        const body = encodeURIComponent(
          `Dear Professor,\n\nStudent ${studentName} has submitted their literature synthesis review on SynthesizeAI.\n\n` +
          `Selected Citation Style: ${selectedCitationStyle}\n` +
          `Active Themes Analyzed: ${themes.map(t => t.title).join(', ') || 'None'}\n\n` +
          `Synthesis Draft:\n${synthesisText}\n\n` +
          `View and grade in the Teacher Review Portal.`
        );
        window.open(`mailto:${teacherEmail}?subject=${subject}&body=${body}`, '_blank');
      };

      // Gather all annotations across papers
      const allAnnotations = papers.flatMap(p => p.annotations.map(a => ({ ...a, paperTitle: p.title, paperOrigin: p.origin })));

      // Color badge for annotation categories (Key Insight, Critique, Recommendation, Limitations)
      const getCategoryBadgeClass = (category) => {
        switch (category) {
          case 'Key Insight':
            return 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300 border-blue-300';
          case 'Critique':
            return 'bg-orange-100 text-orange-800 dark:bg-orange-950 dark:text-orange-300 border-orange-300';
          case 'Recommendation':
            return 'bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300 border-purple-300';
          case 'Limitations':
            return 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300 border-rose-300';
          default:
            return 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300 border-slate-300';
        }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans transition-colors duration-200">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 text-xs font-semibold animate-bounce">
              <i data-lucide="sparkles" className="w-4 h-4 text-amber-400"></i>
              <span>{toast}</span>
            </div>
          )}

          {/* APP HEADER */}
          <header className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 shadow-sm transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
              
              {/* Brand Logo & Title */}
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setStudentStep(0)}>
                <div className="bg-emerald-600 text-white p-2 rounded-xl shadow-md">
                  <i data-lucide="book-open" className="w-5 h-5"></i>
                </div>
                <div>
                  <h1 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    SynthesizeAI <span className="text-[10px] bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 border border-emerald-300 px-2 py-0.5 rounded-full font-semibold">Academic Hub</span>
                  </h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400">Research Literature Review Organization & Synthesis</p>
                </div>
              </div>

              {/* Header Right Controls */}
              <div className="flex items-center space-x-3">
                {/* Gemini Key Input */}
                <div className="hidden md:flex items-center bg-slate-100 dark:bg-slate-700/60 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1 text-xs text-slate-600 dark:text-slate-300">
                  <i data-lucide="key" className="w-3.5 h-3.5 text-amber-500 mr-1.5"></i>
                  <input 
                    type="password"
                    placeholder="Gemini Key (Optional)"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    className="bg-transparent focus:outline-none w-32 text-slate-800 dark:text-slate-100 placeholder-slate-400 text-xs"
                  />
                  {apiKey && <span className="text-emerald-500 font-bold text-[10px] ml-1">Set</span>}
                </div>

                {/* Dark Mode Toggle */}
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors"
                  title="Toggle dark mode"
                >
                  <i data-lucide={darkMode ? "sun" : "moon"} className="w-4 h-4"></i>
                </button>

                {/* Role Switcher */}
                <div className="flex items-center bg-slate-100 dark:bg-slate-700 p-1 rounded-xl border border-slate-200 dark:border-slate-600">
                  <button
                    onClick={() => setRole('student')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                      role === 'student' 
                        ? 'bg-emerald-600 text-white shadow-sm' 
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    Student
                  </button>
                  <button
                    onClick={() => setRole('teacher')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                      role === 'teacher' 
                        ? 'bg-rose-600 text-white shadow-sm' 
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    Teacher Review
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* STUDENT DASHBOARD VIEW */}
          {role === 'student' && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col space-y-6">
              
              {/* WORKFLOW NAVIGATION TABS WITH COLOR-CODING */}
              <div className="bg-white dark:bg-slate-800 rounded-2xl p-2 shadow-sm border border-slate-200 dark:border-slate-700 overflow-x-auto">
                <div className="flex items-center space-x-2 min-w-max text-xs font-semibold">
                  
                  {/* Step 0: Purpose / Intro */}
                  <button 
                    onClick={() => setStudentStep(0)}
                    className={`flex items-center py-2 px-3 rounded-xl transition-all ${
                      studentStep === 0 
                        ? 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 font-bold shadow-sm' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'
                    }`}
                  >
                    <i data-lucide="info" className="w-4 h-4 mr-1.5"></i>
                    Purpose & Guide
                  </button>

                  </div>

                  {/* Display Themes Grid */}
                  {themes.length === 0 ? (
                    <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl border-2 border-dashed border-emerald-200 dark:border-emerald-800 text-center space-y-2">
                      <div className="w-12 h-12 bg-emerald-100 dark:bg-emerald-950 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                        <i data-lucide="layers" className="w-6 h-6"></i>
                      </div>
                      <h3 className="text-xs font-bold text-slate-800 dark:text-slate-200">No Themes Defined Yet</h3>
                      <p className="text-[11px] text-slate-500 max-w-md mx-auto">
                        Input custom synthesis themes above to group your annotated empirical evidence across local and foreign sources.
                      </p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {themes.map(theme => (
                        <div key={theme.id} className={`rounded-2xl p-5 shadow-sm border ${theme.style.bg} ${theme.style.border} flex flex-col justify-between space-y-4`}>
                          <div>
                            <div className="flex items-center justify-between mb-2">
                              <span className={`text-xs font-extrabold ${theme.style.text}`}>
                                {theme.title}
                              </span>
                              <button 
                                onClick={() => setThemes(prev => prev.filter(t => t.id !== theme.id))}
                                className="text-slate-400 hover:text-rose-500 font-bold p-1"
                              >
                                ×
                              </button>
                            </div>

                            {/* Assigned Annotations */}
                            <div className="space-y-2 mt-3">
                              <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Tagged Items in Theme ({theme.annotationIds.length}):</span>
                              {theme.annotationIds.length === 0 ? (
                                <p className="text-xs text-slate-400 italic p-3 text-center bg-white/50 dark:bg-slate-900/40 rounded-xl border border-dashed border-slate-300 dark:border-slate-700">
                                  Click available quotes below to assign to this theme.
                                </p>
                              ) : (
                                theme.annotationIds.map(aId => {
                                  const anno = allAnnotations.find(a => a.id === aId);
                                  if (!anno) return null;
                                  return (
                                    <div key={aId} className="bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs flex items-start justify-between gap-2 shadow-sm">
                                      <div>
                                        <div className="flex items-center space-x-1.5 mb-1">
                                          <span className={`text-[8px] font-extrabold uppercase px-1.5 py-0.2 rounded border ${getCategoryBadgeClass(anno.category)}`}>
                                            {anno.category}
                                          </span>
                                          <span className="text-[9px] font-bold text-slate-500">{anno.paperOrigin}</span>
                                        </div>
                                        <p className="text-slate-800 dark:text-slate-200 font-medium">"{anno.text}"</p>
                                      </div>
                                      <button 
                                        onClick={() => toggleAnnotationInTheme(theme.id, aId)}
                                        className="text-slate-400 hover:text-rose-500 font-bold p-1"
                                      >
                                        ×
                                      </button>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          </div>

                          {/* Available Annotations Selector */}
                          <div className="pt-3 border-t border-slate-200 dark:border-slate-700">
                            <label className="text-[10px] font-bold text-slate-600 dark:text-slate-400 block mb-1.5">Assign Source Quotes:</label>
                            <div className="max-h-32 overflow-y-auto space-y-1">
                              {allAnnotations.map(a => {
                                const isAssigned = theme.annotationIds.includes(a.id);
                                return (
                                  <button
                                    key={a.id}
                                    onClick={() => toggleAnnotationInTheme(theme.id, a.id)}
                                    className={`w-full text-left p-1.5 rounded-lg text-[10px] flex items-center justify-between border transition-all ${
                                      isAssigned 
                                        ? 'bg-emerald-600 text-white font-bold' 
                                        : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'
                                    }`}
                                  >
                                    <span className="truncate mr-1">[{a.category}] "{a.text}"</span>
                                    <span>{isAssigned ? '✓' : '+'}</span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>

                        </div>
                      ))}
                    </div>
                  )}

                </div>
              )}

              {/* STEP 4: SYNTHESIS & BUILT-IN AI COACH (INDIGO THEME) */}
              {studentStep === 4 && (
                <div className="space-y-6">
                  
                  <div className="bg-indigo-50 dark:bg-indigo-950/40 p-5 rounded-2xl border border-indigo-200 dark:border-indigo-800 flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-bold text-indigo-950 dark:text-indigo-100 flex items-center gap-2">
                        <i data-lucide="edit-3" className="w-4 h-4 text-indigo-600"></i> Step 4: Literature Review Synthesis & AI Writing Coach
                      </h2>
                      <p className="text-xs text-indigo-800 dark:text-indigo-300 mt-0.5">
                        Draft your integrated review. The AI Coach checks grammar, structural flow, and {selectedCitationStyle} citations.
                      </p>
                    </div>

                    <div className="flex items-center space-x-2">
                      <span className="text-xs font-bold text-indigo-900 dark:text-indigo-300 bg-indigo-100 dark:bg-indigo-900 px-3 py-1 rounded-lg">
                        Style: {selectedCitationStyle}
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    {/* Left Column: REVISION 8 & 9 (ACTIVE REFLECTED THEMES + BUILT-IN AI COACH) */}
                    <div className="lg:col-span-1 space-y-4">
                      
                      {/* REVISION 8: ACTIVE CLUSTERED THEMES REFLECTED DYNAMICALLY */}
                      <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
                        <h3 className="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2">
                          <i data-lucide="tag" className="w-4 h-4 text-indigo-600"></i> Active Synced Themes ({themes.length})
                        </h3>
                        <p className="text-[11px] text-slate-500 dark:text-slate-400">
                          Reflects custom themes created in Step 3.
                        </p>

                        <div className="space-y-2 max-h-48 overflow-y-auto">
                          {themes.length === 0 ? (
                            <p className="text-xs text-slate-400 italic p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl">
                              No themes created in Step 3 yet.
                            </p>
                          ) : (
                            themes.map(t => (
                              <div key={t.id} className="p-2.5 bg-indigo-50/60 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900 rounded-xl text-xs flex items-center justify-between">
                                <span className="font-bold text-indigo-900 dark:text-indigo-200 text-[11px]">{t.title}</span>
                                <span className="text-[9px] bg-indigo-200 dark:bg-indigo-900 text-indigo-900 dark:text-indigo-200 px-2 py-0.5 rounded-full font-extrabold">
                                  {t.annotationIds.length} items
                                </span>
                              </div>
                            ))
                          )}
                        </div>

                        <button
                          onClick={generateAiSynthesisDraft}
                          disabled={isAiGenerating}
                          className="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 rounded-xl shadow transition-all flex items-center justify-center space-x-1.5"
                        >
                          {isAiGenerating ? (
                            <i data-lucide="refresh-cw" className="w-3.5 h-3.5 animate-spin"></i>
                          ) : (
                            <i data-lucide="sparkles" className="w-3.5 h-3.5 text-amber-300"></i>
                          )}
                          <span>Auto-Draft Synthesis ({selectedCitationStyle})</span>
                        </button>
                      </div>

                      {/* REVISION 9: BUILT-IN AI COACH CARD */}
                      <div className="bg-gradient-to-br from-indigo-950 via-slate-900 to-indigo-900 text-white p-5 rounded-2xl shadow-md space-y-4">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-2 text-amber-400">
                            <i data-lucide="bot" className="w-5 h-5"></i>
                            <h3 className="text-xs font-extrabold text-white">Built-in AI Writing Coach</h3>
                          </div>
                          <button
                            onClick={runAiWritingCoach}
                            disabled={isCoachAnalyzing}
                            className="bg-amber-400 hover:bg-amber-300 text-slate-950 text-[11px] font-extrabold px-3 py-1 rounded-lg transition-all"
                          >
                            {isCoachAnalyzing ? 'Analyzing...' : 'Audit Text'}
                          </button>
                        </div>

                        {aiCoachFeedback ? (
                          <div className="space-y-3 text-xs">
                            <div className="bg-white/10 p-2.5 rounded-xl space-y-1">
                              <span className="font-bold text-amber-300 text-[10px] uppercase block">1. Grammar & Punctuation:</span>
                              <p className="text-slate-200 text-[11px] leading-relaxed">{aiCoachFeedback.grammarCheck}</p>
                            </div>
                            <div className="bg-white/10 p-2.5 rounded-xl space-y-1">
                              <span className="font-bold text-amber-300 text-[10px] uppercase block">2. Structural Flow:</span>
                              <p className="text-slate-200 text-[11px] leading-relaxed">{aiCoachFeedback.structuralAdvice}</p>
                            </div>
                            <div className="bg-white/10 p-2.5 rounded-xl space-y-1">
                              <span className="font-bold text-amber-300 text-[10px] uppercase block">3. {selectedCitationStyle} Compliance:</span>
                              <p className="text-slate-200 text-[11px] leading-relaxed">{aiCoachFeedback.citationCompliance}</p>
                            </div>
                          </div>
                        ) : (
                          <p className="text-xs text-slate-300 italic">
                            Click "Audit Text" to analyze your synthesis for grammar, structural transitions, and {selectedCitationStyle} citation accuracy.
                          </p>
                        )}
                      </div>

                    </div>

                    {/* Right Column: Draft Textarea & REVISION 11 (TEACHER EMAIL & SUBMIT) */}
                    <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between space-y-4">
                      
                      <div>
                        <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                          <div>
                            <h3 className="text-xs font-bold text-slate-900 dark:text-white">Student Synthesis Essay Draft</h3>
                            <p className="text-[11px] text-slate-500">Edit and refine your review prior to teacher submission.</p>
                          </div>
                          <span className="text-xs text-slate-500 font-bold">
                            Word Count: {synthesisText.trim().split(/\s+/).filter(Boolean).length}
                          </span>
                        </div>

                        <textarea
                          value={synthesisText}
                          onChange={(e) => setSynthesisText(e.target.value)}
                          rows={14}
                          className="w-full mt-4 p-4 text-xs sm:text-sm font-serif text-slate-800 dark:text-slate-200 leading-relaxed border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none bg-slate-50/50 dark:bg-slate-900/50"
                          placeholder="Type or generate your literature synthesis here..."
                        />
                      </div>

                      {/* REVISION 11: TEACHER EMAIL INPUT & SUBMISSION */}
                      <div className="pt-4 border-t border-slate-100 dark:border-slate-700 space-y-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] font-bold text-slate-600 dark:text-slate-400 block mb-1">Student Name:</label>
                            <input 
                              type="text" 
                              value={studentName}
                              onChange={(e) => setStudentName(e.target.value)}
                              className="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200"
                            />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-600 dark:text-slate-400 block mb-1">Teacher Email Address:</label>
                            <input 
                              type="email" 
                              value={teacherEmail}
                              onChange={(e) => setTeacherEmail(e.target.value)}
                              placeholder="instructor@university.edu.ph"
                              className="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200"
                            />
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-2">
                          <span className="text-xs text-slate-400 flex items-center gap-1">
                            <i data-lucide="mail" className="w-3.5 h-3.5 text-indigo-500"></i>
                            Dispatches email submission directly to instructor
                          </span>

                          <button
                            onClick={handleSubmitToTeacher}
                            disabled={isSubmitted}
                            className={`px-6 py-3 rounded-xl text-xs font-bold flex items-center space-x-2 shadow-md transition-all ${
                              isSubmitted 
                                ? 'bg-emerald-600 text-white cursor-default' 
                                : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                            }`}
                          >
                            <i data-lucide="send" className="w-4 h-4"></i>
                            <span>{isSubmitted ? 'Submitted to Teacher ✓' : 'Submit & Email Teacher'}</span>
                          </button>
                        </div>
                      </div>

                    </div>

                  </div>
                </div>
              )}

            </main>
          )}

          {/* TEACHER DASHBOARD VIEW (ROSE THEME) */}
          {role === 'teacher' && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
              
              <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 p-5 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-extrabold uppercase tracking-wider bg-rose-200 dark:bg-rose-900 text-rose-900 dark:text-rose-100 px-2.5 py-0.5 rounded-full">
                      Teacher Review Portal
                    </span>
                    <span className="text-xs text-rose-800 dark:text-rose-300 font-bold">• Student: {studentName}</span>
                  </div>
                  <h2 className="text-sm font-bold text-slate-900 dark:text-white mt-1">Literature Review Synthesis Grading & Sentence Feedback</h2>
                </div>

                <button
                  onClick={() => {
                    setReviewPublished(true);
                    triggerToast('Evaluation and feedback published to student!');
                  }}
                  className="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center space-x-2 shadow-md transition-all"
                >
                  <i data-lucide="check-circle-2" className="w-4 h-4"></i>
                  <span>Publish Grades & Feedback</span>
                </button>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* Left Column: Student Text Preview */}
                <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                    <h3 className="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2">
                      <i data-lucide="file-text" className="w-4 h-4 text-rose-600"></i> Submitted Student Review Draft
                    </h3>
                    <span className="text-xs font-bold text-rose-600">Citation Style: {selectedCitationStyle}</span>
                  </div>

                  <div className="p-4 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm font-serif text-slate-800 dark:text-slate-200 leading-relaxed whitespace-pre-wrap">
                    {synthesisText}
                  </div>
                </div>

                {/* Right Column: Grading Rubric */}
                <div className="lg:col-span-1 space-y-4">
                  <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                    <h3 className="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2">
                      <i data-lucide="award" className="w-4 h-4 text-rose-600"></i> Assessment Rubric
                    </h3>

                    <div className="space-y-3 text-xs">
                      <div>
                        <div className="flex justify-between mb-1 font-semibold text-slate-700 dark:text-slate-300">
                          <span>Critical Analysis</span>
                          <span className="text-rose-600 font-bold">{teacherRubric.criticalAnalysis} / 5</span>
                        </div>
                        <input 
                          type="range" min="1" max="5" 
                          value={teacherRubric.criticalAnalysis}
                          onChange={(e) => setTeacherRubric({ ...teacherRubric, criticalAnalysis: parseInt(e.target.value) })}
                          className="w-full accent-rose-600"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between mb-1 font-semibold text-slate-700 dark:text-slate-300">
                          <span>Thematic Coherence</span>
                          <span className="text-rose-600 font-bold">{teacherRubric.thematicCoherence} / 5</span>
                        </div>
                        <input 
                          type="range" min="1" max="5" 
                          value={teacherRubric.thematicCoherence}
                          onChange={(e) => setTeacherRubric({ ...teacherRubric, thematicCoherence: parseInt(e.target.value) })}
                          className="w-full accent-rose-600"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between mb-1 font-semibold text-slate-700 dark:text-slate-300">
                          <span>Source Integration</span>
                          <span className="text-rose-600 font-bold">{teacherRubric.sourceIntegration} / 5</span>
                        </div>
                        <input 
                          type="range" min="1" max="5" 
                          value={teacherRubric.sourceIntegration}
                          onChange={(e) => setTeacherRubric({ ...teacherRubric, sourceIntegration: parseInt(e.target.value) })}
                          className="w-full accent-rose-600"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between mb-1 font-semibold text-slate-700 dark:text-slate-300">
                          <span>{selectedCitationStyle} Compliance</span>
                          <span className="text-rose-600 font-bold">{teacherRubric.synthesisClarity} / 5</span>
                        </div>
                        <input 
                          type="range" min="1" max="5" 
                          value={teacherRubric.synthesisClarity}
                          onChange={(e) => setTeacherRubric({ ...teacherRubric, synthesisClarity: parseInt(e.target.value) })}
                          className="w-full accent-rose-600"
                        />
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between font-bold text-xs">
                      <span className="text-slate-700 dark:text-slate-300">Total Rubric Score:</span>
                      <span className="text-base text-rose-600">
                        {Object.values(teacherRubric).reduce((a, b) => a + b, 0)} / 20
                      </span>
                    </div>
                  </div>

                  <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-2">
                    <h3 className="text-xs font-bold text-slate-900 dark:text-white">Instructor Notes & Feedback</h3>
                    <textarea
                      value={teacherFeedbackText}
                      onChange={(e) => setTeacherFeedbackText(e.target.value)}
                      rows={4}
                      className="w-full p-2.5 text-xs border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
                    />
                  </div>
                </div>

              </div>
            </main>
          )}

          {/* FOOTER */}
          <footer className="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-4 text-center text-xs text-slate-400 mt-auto transition-colors">
            SynthesizeAI Microsite — Research Literature Review Organization & AI Feedback System
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
